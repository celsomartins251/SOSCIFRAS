<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOS Cifras — Teste do importador</title>
<style>
:root{color-scheme:dark;--bg:#101010;--card:#1b1b1b;--ink:#f4f1e8;--muted:#aaa398;--gold:#d5aa42;--line:#39342a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}h1{color:var(--gold);font-size:25px}p{color:var(--muted)}input,textarea,button{font:inherit;border-radius:10px;padding:12px;border:1px solid var(--line)}input,textarea{width:100%;background:var(--card);color:var(--ink);margin:5px 0 12px}textarea{min-height:260px;font:14px/1.5 monospace}button{background:var(--gold);color:#17130a;font-weight:700;cursor:pointer;margin:3px 4px 8px 0}.ghost{background:var(--card);color:var(--ink)}label{display:block;color:var(--muted);font-size:13px}.preview{background:var(--card);padding:14px;border-radius:12px;overflow:auto;font:14px/1.65 monospace;white-space:pre;min-height:100px}.chords{color:#f0c65b;font-weight:bold}.lyric{color:var(--ink)}.status{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;color:var(--muted)}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:600px){.row{display:block}}
</style></head><body><main>
<h1>SOS CIFRAS — Teste do importador</h1>
<p>Ambiente separado para validar a leitura de links e a separação de acordes e letra. Não altera nem salva nada na versão principal.</p>
<label for="url">Endereço da cifra</label><input id="url" value="https://vocepodetocar.com.br/cifras/djavan/oceano">
<button id="fetch">Ler página pelo link</button>
<div id="status" class="status">Cole uma cifra ou tente ler o endereço acima.</div>
<label for="source">Texto copiado ou recebido do site</label><textarea id="source" placeholder="Cole aqui a cifra original, mesmo que os acordes estejam grudados na letra."></textarea>
<div class="row"><button id="convert">Organizar cifra</button><button id="reset" class="ghost">Restaurar exemplo</button></div>
<label>Resultado organizado (acordes acima da letra)</label><div id="preview" class="preview"></div>
</main><script>
const sample = `Assim    que o dia amanheceuDG7MA7
Lá no mar alto da paixãoA#°BmBm7M
   Dava pra ver o tempo ruirBm7Bm6Am7D7(9)
   Cadê você?   Que solidão...Gm7C7(9)F#m7B7(b9)
Esquecerá de mimE7(9)A7(4)
 Enfim     de tudo que há na terraDG7MA7
Não há nada em lugar nenhumA#°BmBm7M
   Que vá crescer     Bm7Bm6
sem você chegarAm7D7(9)
   Longe de ti tudo parouGm7C7(9)F#m7B7(b9)
Ninguém sabe o que eu sofriE7(9)A7(4)`;
const status = m => document.getElementById('status').textContent=m;
const chordAt = (s,i) => {
 const root=s.slice(i).match(/^[A-G](?:#|b)?/); if(!root)return null;
 const start=i+root[0].length;
 const q=s.slice(start).match(/^(?:(?:maj|min|dim|aug|sus|add|m|M|°|º|ø|\+|-)?(?:\d+)?(?:[#b](?:\d+)?)*(?:\([^)]*\))?(?:M|m|maj|min|dim|aug|sus|add|°|º|ø)?)/);
 if(!q)return null;
 const token=root[0]+q[0];
 if(!token || token.length===root[0].length && !/^[A-G]/.test(root[0]))return null;
 return token;
};
function splitChordRun(run){
 const memo=new Map();
 function solve(i){
  if(i===run.length)return [];
  if(memo.has(i))return memo.get(i);
  let best=null;
  for(let j=i+1;j<=run.length;j++){
   const token=run.slice(i,j);
   if(!/^[A-G](?:#|b)?(?:(?:maj|min|dim|aug|sus|add|m|M|°|º|ø|\+|-)?(?:\d+)?(?:[#b](?:\d+)?)*(?:\([^)]*\))?(?:M|m|maj|min|dim|aug|sus|add|°|º|ø)?)$/.test(token))continue;
   const rest=solve(j);
   if(rest!==null){const candidate=[token,...rest];if(!best||candidate.length>best.length)best=candidate;}
  }
  memo.set(i,best);return best;
 }
 const result=solve(0);return result&&result.length>=2?result:null;
}
function findTrailingChords(line){
 let end=line.length;while(end>0&&/\s/.test(line[end-1]))end--;
 for(let start=end-1;start>=0;start--){
  if(start>0 && /[A-Za-zÀ-ÿ]/.test(line[start-1]))continue;
  const run=line.slice(start,end),tokens=splitChordRun(run);
  if(tokens)return {lyric:line.slice(0,start).replace(/\s+$/,''),prefix:line.slice(0,start).match(/^\s*/)[0],tokens};
 }
 // Segunda tentativa: a cifra pode estar imediatamente depois de uma palavra.
 for(let start=end-1;start>=0;start--){
  const run=line.slice(start,end),tokens=splitChordRun(run);
  if(tokens && start>0 && /[A-Za-zÀ-ÿ]/.test(line[start-1]))return {lyric:line.slice(0,start),prefix:'',tokens};
 }
 return null;
}
function isChordLine(line){const t=line.trim();return !!t&&splitChordRun(t.replace(/\s+/g,''))!==null || /^\s*(?:[A-G](?:#|b)?[^\s]*\s*)+\s*$/.test(line.trim())&&/^[A-G]/.test(line.trim());}
function organize(raw){
 const out=[];
 for(const original of raw.replace(/\r/g,'').split('\n')){
  const line=original.replace(/\t/g,'    ').replace(/\s+$/,'');
  if(!line.trim()){out.push({type:'blank',text:''});continue}
  if(/^\s*(?:\[.*\]|#{1,3}\s*\[.*\])\s*$/.test(line)){out.push({type:'section',text:line.trim().replace(/^#+\s*/, '')});continue}
  const found=findTrailingChords(line);
  if(found && found.lyric.trim()){
   const chordText=found.tokens.join('   ');
   const indent=found.prefix + ' '.repeat(Math.max(0,found.lyric.trimStart().length));
   out.push({type:'chords',text:indent+chordText});
   out.push({type:'lyric',text:found.lyric});
  }else if(isChordLine(line)){
   out.push({type:'chords',text:line});
  }else out.push({type:'lyric',text:line});
 }
 return out;
}
function show(){
 const lines=organize(document.getElementById('source').value);
 document.getElementById('preview').innerHTML=lines.map(x=>x.type==='blank'?'':x.type==='section'?'<span class="chords">'+esc(x.text)+'</span>':x.type==='chords'?'<span class="chords">'+esc(x.text)+'</span>':'<span class="lyric">'+esc(x.text)+'</span>').join('\n');
 status('Processamento concluído: '+lines.filter(x=>x.type==='chords').length+' linhas de acordes identificadas. Confira o alinhamento antes de aprovar.');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
document.getElementById('convert').onclick=show;
document.getElementById('reset').onclick=()=>{document.getElementById('source').value=sample;show()};
document.getElementById('fetch').onclick=async()=>{
 const url=document.getElementById('url').value.trim();if(!url){status('Informe o endereço.');return}
 status('Tentando ler a página…');
 try{
  const r=await fetch('https://r.jina.ai/'+url,{headers:{Accept:'text/plain'}});
  const txt=await r.text();if(!r.ok)throw Error('O serviço de leitura respondeu HTTP '+r.status);
  let data=txt;try{const j=JSON.parse(txt);data=j.data?.content||j.content||txt}catch{}
  if(!data||data.length<30)throw Error('A página não retornou texto suficiente.');
  document.getElementById('source').value=data;show();status('Página lida. O texto foi carregado; confira o resultado organizado.');
 }catch(e){status('Não foi possível ler o link automaticamente: '+e.message+'. Cole o texto copiado no campo abaixo para testar a organização.');}
};
document.getElementById('source').value=sample;show();
</script></body></html>
