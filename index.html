<style>
:root{--bg:#101010;--card:#1b1b1b;--ink:#f4f1e8;--mute:#aaa398;--line:#39342a;--brand:#d5aa42;--onbrand:#17130a;--chord:#f0c65b;--bar:#5a451b;--ok:#d5aa42}
:root[data-theme="light"]{--bg:#f6f3eb;--card:#ffffff;--ink:#24211b;--mute:#6f695e;--line:#d8d0c1;--brand:#9b741c;--onbrand:#fffdf7;--chord:#76540b;--bar:#9b741c;--ok:#9b741c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#f6f3eb;--card:#ffffff;--ink:#24211b;--mute:#6f695e;--line:#d8d0c1;--brand:#9b741c;--onbrand:#fffdf7;--chord:#76540b;--bar:#9b741c;--ok:#9b741c}}
:root[data-theme="dark"]{--bg:#101010;--card:#1b1b1b;--ink:#f4f1e8;--mute:#aaa398;--line:#39342a;--brand:#d5aa42;--onbrand:#17130a;--chord:#f0c65b;--bar:#5a451b}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 0 8px}
.logo{font-weight:800;font-size:30px;letter-spacing:-.04em;color:var(--brand);text-align:center;margin:18px 0 2px}
.sub{color:var(--mute);text-align:center;margin:0 0 18px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;min-height:300px;line-height:1.5}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;color:var(--ink);background:none}
.btn{background:var(--brand);color:var(--onbrand);border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:56px}
.item b{display:block;font-weight:600}.item small{color:var(--mute)}
.ico{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);display:grid;place-items:center;flex:none;font-weight:800}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin:-16px -16px 12px;padding:10px 16px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tb{min-width:44px;min-height:44px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:700}
.tb.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.sec{background:var(--bar);color:#fff;text-align:center;font-weight:600;font-size:14px;border-radius:8px;padding:5px;margin:18px 0 8px}
.cs{font-family:"JetBrains Mono",ui-monospace,monospace;white-space:pre;overflow-x:auto}
.c{color:var(--chord);font-weight:700}.l{color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs>div{display:flex;width:100%;max-width:760px;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);min-height:48px;justify-content:center}
.tab.on{color:var(--brand);font-weight:700}.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tab.mid{flex:none;width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--onbrand);margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:92vw}
.seq{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:4}
.seq .btn{box-shadow:0 3px 10px rgba(0,0,0,.2)}
label{font-size:13px;color:var(--mute);display:block;margin:12px 0 4px}
.sig{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding:12px 16px 0}
.sig span{color:var(--brand);font:600 24px/1.2 'Dancing Script','Segoe Script','Brush Script MT',cursive;letter-spacing:.01em}
.helpbtn{font:600 13px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--brand);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;min-height:36px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-bottom:8px}
summary{font-weight:600;padding:12px 0;cursor:pointer;min-height:44px}
details ul,details ol{padding-left:20px;margin:2px 0 12px}details li{margin:6px 0}details p{margin:4px 0 12px}
.rules{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;white-space:pre;overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 10px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

.brandimg{background:var(--logo) center/contain no-repeat}
.logo.brandimg{height:170px;font-size:0;margin:6px auto 4px;filter:drop-shadow(0 6px 18px rgba(213,170,66,.18))}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#2a2110 0%,#101010 62%);overflow:hidden;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .glow{position:absolute;width:140vmin;height:140vmin;left:50%;top:50%;margin:-70vmin 0 0 -70vmin;background:repeating-conic-gradient(from 0deg,rgba(240,198,91,.10) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);opacity:0}
#splash .box{position:relative;width:min(68vw,52vh,420px);aspect-ratio:1;opacity:0}
#splash .box .brandimg{position:absolute;inset:0;filter:drop-shadow(0 0 28px rgba(240,198,91,.35))}
#splash .shine{position:absolute;inset:0;-webkit-mask-image:var(--logo);mask-image:var(--logo);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%) -150% 0/250% 100% no-repeat}
#splash .bar{position:absolute;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));width:120px;height:3px;margin-left:-60px;border-radius:3px;background:rgba(213,170,66,.2);overflow:hidden;opacity:0}
#splash .bar i{display:block;height:100%;width:100%;background:var(--brand);transform:scaleX(0);transform-origin:left}
@media (prefers-reduced-motion:no-preference){
#splash .glow{animation:gl 2.6s ease-out .1s forwards,spin 14s linear infinite}
#splash .box{animation:pop 1s cubic-bezier(.2,1.25,.4,1) .15s forwards}
#splash .shine{animation:sh 1.1s ease-in-out 1.05s forwards}
#splash .bar{animation:fi .4s ease .5s forwards}
#splash .bar i{animation:ld 1.9s ease-in-out .5s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.45) rotate(-8deg);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes gl{0%{opacity:0}40%{opacity:1}100%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:150% 0}}
@keyframes fi{to{opacity:1}}
@keyframes ld{to{transform:scaleX(1)}}}
@media (prefers-reduced-motion:reduce){#splash .box,#splash .glow,#splash .bar{opacity:1}#splash .bar i{transform:scaleX(1)}}
</style>

const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const CH=/^([A-G][#b]?)((?:m|M|maj|min|dim|aug|sus|add|dim|°|º|ø|\d+|[#b+\-]|\([^)]*\))*)(?:\/([A-G][#b]?|\d+))?$/;
const REP=/^\(?(?:\d+x|x\d+)\)?$/i;
const nn=(n,s)=>N[((N.indexOf(FL[n]||n)+s)%12+12)%12];
const trTok=(t,s)=>{const m=t.match(CH);return m?nn(m[1],s)+m[2]+(m[3]?'/'+(/^\d/.test(m[3])?m[3]:nn(m[3],s)):''):t};
const cnt=(s,c)=>s.split(c).length-1;
const parTok=t=>{let pre=(t.match(/^\(+/)||[''])[0],c=t.slice(pre.length),suf='';while(c.endsWith(')')&&cnt(c,')')>cnt(c,'(')){c=c.slice(0,-1);suf+=')'}return[pre,c,suf]};
const isChordLine=l=>{const k=l.trim().split(/\s+/).filter(Boolean);return k.length>0&&k.every(t=>t==='|'||/^\|*$/.test(t)||REP.test(t)||/^[()]+$/.test(t)||CH.test(parTok(t)[1]))&&k.some(t=>CH.test(parTok(t)[1]))};
const trLine=(l,s)=>l.replace(/(\S+)( *)/g,(_,t,sp)=>{const[pre,c,suf]=parTok(t);if(t==='|'||!CH.test(c))return t+sp;const n=pre+trTok(c,s)+suf;return n+(sp?' '.repeat(Math.max(1,sp.length-(n.length-t.length))):'')});
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ===== IMPORTAÇÃO: normalização, seções, acordes colados, arquivos e links ===== */
const cleanText=s=>String(s||'').replace(/\r\n?/g,'\n').replace(/[\u00a0\u1680\u2000-\u200a\u202f\u205f\u3000]/g,' ').replace(/[\u200b-\u200d\u2060\ufeff]/g,'').replace(/♯/g,'#').replace(/♭/g,'b').replace(/\t/g,'    ');
function sectionName(raw){
 const x=raw.toLowerCase().replace(/[()\[\]]/g,'').replace(/[：:]\s*$/,'').replace(/\s*\(?\d+\s*x\)?\s*$/,'').trim();
 if(/^(intro|introduction|introdução|introducao)(\s+\d+)?$/.test(x))return'Intro';
 if(/^(pr[eé][\s-]?(refr[aã]o|chorus))(\s+\d+)?$/.test(x))return'Pré-Refrão';
 if(/^(verse|verso|estrofe|(primeira|segunda|terceira|quarta|quinta)\s+parte|parte\s+\d+)(\s+\d+)?$/.test(x))return'Verso';
 if(/^(chorus|refr[aã]o|refrain)(\s+(\d+|final))?$/.test(x))return'Refrão';
 if(/^(bridge|ponte)(\s+\d+)?$/.test(x))return'Ponte';
 if(/^(solo|instrumental|interl[uú]dio|interlude)(\s+\d+)?$/.test(x))return'Solo';
 if(/^(outro|ending|end|final|coda|fim)$/.test(x))return'Final';
 return null;
}
const CHORD_TOKEN=/^[A-G](?:#|b)?(?:(?:maj|min|dim|aug|sus|add|m|M|°|º|ø|\+|-)?(?:\d+)?(?:[#b](?:\d+)?)*(?:\([^)]*\))?(?:M|m|maj|min|dim|aug|sus|add|°|º|ø)?)(?:\/(?:[A-G](?:#|b)?|\d+))?$/;
function splitChordRun(run){
 const memo=new Map();
 function solve(i){
  if(i===run.length)return [];
  if(memo.has(i))return memo.get(i);
  let best=null;
  for(let j=i+1;j<=run.length;j++){
   const token=run.slice(i,j);
   if(!CHORD_TOKEN.test(token))continue;
   const rest=solve(j);
   if(rest!==null){const candidate=[token,...rest];if(!best||candidate.length>best.length)best=candidate;}
  }
  memo.set(i,best);return best;
 }
 return solve(0);
}
/* Acordes grudados no fim da letra (ex.: "amanheceuDG7MA7"). Só age quando o trecho final não tem espaços. */
function findTrailingChords(line){
 for(let start=1;start<line.length;start++){
  const spaced=/\s/.test(line[start-1]);
  const tail=line.slice(start);
  if(!/^[A-G]\S*$/.test(tail))continue;
  const tokens=splitChordRun(tail);
  const lyric=line.slice(0,start).replace(/\s+$/,'');
  if(!tokens||!tokens.length||!/[A-Za-zÀ-ÿ]/.test(lyric))continue;
  if(tokens.length>=2||(!spaced&&/[a-zà-ÿ.,;:!?…)"'’]$/.test(line[start-1])))return{lyric,tokens};
 }
 return null;
}
function organizeImportedText(raw,chordOnly){
 const out=[];
 const rows=cleanText(raw).split('\n');
 let inBank=false,hasSection=false;
 const sec=n=>{out.push('['+n+']');hasSection=true};
 for(const original of rows){
  const line=original.replace(/\s+$/,'');
  const t=line.trim();
  if(/^\s*Acordes da música\s*$/i.test(line)){inBank=true;continue;}
  if(inBank){
   if(!t)continue;
   if(isChordLine(line))continue;
   inBank=false;
  }
  if(!t){if(out.length&&out[out.length-1]!=='')out.push('');continue;}
  if(/^https?:\/\//i.test(t)||/^(Title|URL Source|Markdown Content):/i.test(t))continue;
  if(/^Essa cifra te ajudou\?/i.test(t))continue;
  /* [Seção] sozinha, ou [Seção] seguida de acordes na mesma linha */
  const head=t.replace(/^#{1,6}\s*/,'').match(/^\[([^\]]+)\]\s*(.*)$/);
  if(head){
   const name=sectionName(head[1])||head[1].trim();
   if(!head[2]){sec(name);continue;}
   if(isChordLine(head[2])){sec(name);out.push(head[2]);continue;}
  }
  /* "Intro: G C D" */
  const lab=t.match(/^([^:\[\]]{2,24}):\s+(.+)$/);
  if(lab&&sectionName(lab[1])&&isChordLine(lab[2])){sec(sectionName(lab[1]));out.push(lab[2]);continue;}
  const only=sectionName(t.replace(/^#{1,6}\s*/,''));
  if(only){sec(only);continue;}
  /* linha de acordes legítima vem primeiro: nunca pode ser "quebrada" */
  if(isChordLine(line)){out.push(line);continue;}
  if(/^[A-G]\S*$/.test(t)){const w=splitChordRun(t);if(w&&w.length>=2){out.push(w.join('   '));continue;}}
  const found=findTrailingChords(line);
  if(found){out.push(found.tokens.join('   '));if(!chordOnly)out.push(found.lyric);continue;}
  if(!chordOnly)out.push(line);
 }
 while(out.length&&out[0]==='')out.shift();
 while(out.length&&out[out.length-1]==='')out.pop();
 if(!out.length)return'';
 if(!hasSection)out.unshift(chordOnly?'[Intro]':'[Verso]');
 return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function chordProToText(raw){
 const out=[];
 const meta={};
 const lines=cleanText(raw).split('\n');
 const chord=/^[A-G](?:#|b)?(?:m|M|maj|min|dim|aug|sus|add|°|º|ø)?(?:\d+)?(?:[#b]\d+)?(?:\([^)]*\))?(?:\/[A-G](?:#|b)?)?$/;
 for(const line of lines){
  const directive=line.match(/^\s*\{([^:}]+):?\s*([^}]*)\}\s*$/);
  if(directive){
   const tag=directive[1].toLowerCase().trim(),value=directive[2].trim();
   if(['title','t'].includes(tag)){if(value)meta.title=value;continue;}
   if(['artist','subtitle','st'].includes(tag)){if(value)meta.artist=value;continue;}
   if(tag==='key'){if(value)meta.key=value;continue;}
   if(['start_of_verse','sov'].includes(tag)){out.push('[Verso]');continue;}
   if(['start_of_chorus','soc'].includes(tag)){out.push('[Refrão]');continue;}
   if(['start_of_bridge','sob'].includes(tag)){out.push('[Ponte]');continue;}
   if(['start_of_tab','sot','start_of_grid','sog'].includes(tag)){out.push('[Intro]');continue;}
   if(['end_of_verse','eov','end_of_chorus','eoc','end_of_bridge','eob','end_of_tab','eot','end_of_grid','eog','new_page'].includes(tag)){out.push('');continue;}
   if(['comment','c'].includes(tag)){if(value)out.push('['+value+']');continue;}
   continue;
  }
  let lyric='',chordLine='',last=0,found=false,m;
  const re=/\[([^\]\s]+)\]/g;
  while((m=re.exec(line))){
   const c=m[1];
   if(!chord.test(c))continue;
   const before=line.slice(last,m.index);lyric+=before;
   chordLine=chordLine.padEnd(lyric.length,' ')+c;
   found=true;last=re.lastIndex;
  }
  lyric+=line.slice(last);
  if(found){out.push(chordLine.trimEnd());if(lyric.trim())out.push(lyric);}
  else out.push(line);
 }
 return{body:out.join('\n'),meta};
}
function htmlFileToText(raw){
 const doc=new DOMParser().parseFromString(raw,'text/html');
 doc.querySelectorAll('script,style,noscript,svg,nav,header,footer,button,input,select,textarea').forEach(n=>n.remove());
 doc.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));
 doc.querySelectorAll('p,div,section,article,li,tr,h1,h2,h3,h4').forEach(n=>n.append('\n'));
 return(doc.body?.textContent||'').replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
/* Páginas de cifra guardam a cifra em <pre>: textContent preserva o alinhamento dos acordes sobre a letra */

 doc.querySelectorAll('script,style,noscript').forEach(n=>n.remove());
 doc.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));

 return{title,artist,text};
}
async function docxToText(buf){
 const u=new Uint8Array(buf),dv=new DataView(buf);
 let p=u.length-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;
 if(p<0)throw new Error('Arquivo DOCX inválido ou corrompido.');
 const n=dv.getUint16(p+10,true);let o=dv.getUint32(p+16,true);
 for(let i=0;i<n;i++){
  const method=dv.getUint16(o+10,true),csize=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
  const name=new TextDecoder().decode(u.subarray(o+46,o+46+nl));
  if(name==='word/document.xml'){
   const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u.subarray(start,start+csize);
   const xml=method===0?new TextDecoder().decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return xml.replace(/<w:tab\/>/g,'\u0001').replace(/<w:(?:br|cr)[^>]*\/>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/\u0001/g,'\t')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  }
  o+=46+nl+el+cl;
 }
 throw new Error('Não encontrei o texto dentro do DOCX.');
}

/* PDF: reconstrói linhas pela posição (x,y) de cada trecho; acordes alinhados à letra logo abaixo */
function pdfPageToLines(items,cw){
 const rows=[];
 items.filter(i=>i.str).sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const r=rows.find(r=>Math.abs(r.y-i.y)<=2.5);if(r)r.it.push(i);else rows.push({y:i.y,it:[i]})});
 rows.sort((a,b)=>b.y-a.y);
 rows.forEach(r=>{r.it.sort((a,b)=>a.x-b.x);const l=r.it[r.it.length-1];r.min=r.it[0].x;r.max=l.x+l.w;r.chord=isChordLine(r.it.map(i=>i.str).join(' '))});
 const place=(r,origin,pc)=>{let s='',end=null;for(const i of r.it){const col=Math.max(0,Math.round((i.x-origin)/pc));
  if(s.length>col){if(end!==null&&i.x-end>pc*0.3&&!/\s$/.test(s)&&!/^\s/.test(i.str))s+=' ';s+=i.str}else s=s.padEnd(col,' ')+i.str;end=i.x+i.w}return s};
 rows.forEach(r=>{if(!r.chord){r.text=place(r,r.min,cw);r.pc=Math.max(1,(r.max-r.min)/Math.max(r.text.length,1))}});
 const left=Math.min(...rows.map(r=>r.min));
 rows.forEach((r,k)=>{if(r.chord){const n=rows.slice(k+1,k+3).find(x=>!x.chord);r.text=n?place(r,n.min,n.pc):place(r,left,cw)}});
 const gaps=rows.slice(1).map((r,k)=>rows[k].y-r.y).sort((a,b)=>a-b),med=gaps.length?gaps[gaps.length>>1]:12,out=[];
 rows.forEach((r,k)=>{if(k&&rows[k-1].y-r.y>med*1.9)out.push('');out.push(r.text.replace(/\s+$/,''))});
 return out;
}
let PDFJS=null;
async function loadPdfJs(){
 if(PDFJS)return PDFJS;
 const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
 const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar o leitor de PDF (é preciso internet).'));document.head.appendChild(s)});
 await load(base+'pdf.min.js');
 /* worker como <script> comum (sem blob/Worker): funciona dentro de sandbox e no GitHub Pages */
 await load(base+'pdf.worker.min.js');
 window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
 return PDFJS=window.pdfjsLib;
}
async function pdfToText(buf){
 const lib=await loadPdfJs(),pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise,pages=[];
 for(let n=1;n<=pdf.numPages;n++){const tc=await (await pdf.getPage(n)).getTextContent();pages.push(tc.items.map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width})))}
 const ws=pages.flat().filter(i=>i.str.trim().length>=4).map(i=>i.w/i.str.length).sort((a,b)=>a-b);
 const cw=ws.length?ws[ws.length>>1]:5;
 const text=pages.map(p=>pdfPageToLines(p,cw).join('\n')).join('\n\n').trim();
 if(!text)throw new Error('Este PDF não tem texto (parece digitalizado/imagem). Use um PDF gerado pelo site ou cole o texto.');
 return text;
}
async function loadChordFile(file){
 const ext=(file.name.split('.').pop()||'').toLowerCase();
 let source,meta={};
 if(ext==='docx')source=await docxToText(await file.arrayBuffer());
 else if(ext==='pdf'||(await file.slice(0,5).text())==='%PDF-'){toast('Lendo o PDF…');source=await pdfToText(await file.arrayBuffer());}
 else{
  const raw=await file.text(),head=raw.slice(0,2000);
  if(/\u0000/.test(head)||(head.match(/\ufffd/g)||[]).length>20)throw new Error('Formato não suportado. Use TXT, DOCX, PDF, ChordPro ou HTML (DOC antigo não é lido).');
  source=raw;
  if(['pro','chopro','cho','crd'].includes(ext)){const c=chordProToText(raw);source=c.body;meta=c.meta;}
  else if(['html','htm'].includes(ext)){
   if(/localStorage|const\s+SEED|id=["']app["']/.test(raw))throw new Error('Este arquivo é um aplicativo HTML, não uma cifra individual. Exporte a música como TXT ou ChordPro.');
   const x=extractFromHtml(raw);source=x.text;meta={title:x.title,artist:x.artist};
   if(!source||source.length<8)throw new Error('Não encontrei letra ou acordes legíveis neste HTML.');
  }
 }
 const body=organizeImportedText(source,false);
 if(!body)throw new Error('Não encontrei conteúdo de cifra aproveitável no arquivo.');

}
async function fetchText(url,ms){
 let tm;
 const limit=new Promise((_,no)=>{tm=setTimeout(()=>no(new Error('tempo esgotado')),ms)});
 try{
  return await Promise.race([(async()=>{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()})(),limit]);
 }catch(err){throw new Error(err.message==='Failed to fetch'?'bloqueado (CORS/rede)':err.message)}
 finally{clearTimeout(tm)}
}

const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /sos_cifras_groups/{code} {
      allow read: if request.auth != null;

        && request.resource.data.owner == request.auth.uid;

        resource.data.leader == request.auth.uid ||

         && request.resource.data.members.toSet()

function vAjuda(){return `<h1>Ajuda</h1><p class="sub" style="text-align:left">Toque em um assunto para abrir. Tudo o que o aplicativo faz está explicado aqui.</p>
<details open><summary>Visão geral das abas</summary><ul>
<li><b>Público</b>: cifras da comunidade.</li><li><b>Setlists</b>: seus repertórios (listas de músicas para o culto, ensaio ou show).</li><li><b>Web</b>: importar cifras por pesquisa, link, texto copiado ou arquivo.</li><li><b>Busca</b> (botão redondo): procurar suas cifras pelo título ou artista e criar cifras novas.</li><li><b>Banda</b>: sincronizar repertório e música atual entre os aparelhos do grupo.</li><li><b>Conta</b>: aparência (claro, escuro ou automático) e restauração dos exemplos.</li></ul></details>
<details><summary>Busca e cifra aberta</summary><ul>
<li>Digite o título ou o artista. Suas cifras aparecem em "Suas cifras" e as da comunidade em "Comunidade". Toque em uma música para abrir.</li>
<li><b>− e +</b>: baixam ou sobem o tom, meio tom por toque. Os acordes são recalculados, inclusive baixos como D/F# e extensões como Em7/9.</li>
<li><b>A− e A+</b>: diminuem ou aumentam o tamanho da letra.</li>
<li><b>▶ / ❚❚</b>: ligam e pausam a rolagem automática.</li>
<li><b>★</b>: marca ou desmarca como favorita.</li>
<li><b>✎</b>: edita a cifra.</li>
<li><b>▤+</b>: adiciona a música a uma setlist.</li>
<li><b>⎙</b>: imprime ou salva em PDF pelo recurso do aparelho.</li>
<li>Dentro de uma setlist, os botões <b>‹ Anterior</b> e <b>Próxima ›</b> aparecem embaixo para passar de música sem voltar à lista.</li></ul></details>
<details><summary>Criar e editar cifras</summary><ul>
<li>Na Busca, toque em <b>Criar cifra manualmente</b>. Preencha título, artista e tom, escolha o formato e escreva ou cole a cifra.</li>
<li><b>Formato</b>: "Acordes com letra" mantém letra e acordes; "Somente acordes" mostra só os acordes.</li>
<li>Para separar as partes use <b>[Intro]</b>, <b>[Verso]</b>, <b>[Refrão]</b>, <b>[Ponte]</b> e <b>[Final]</b> em linha própria. Elas aparecem como faixas coloridas.</li>
<li>Escreva a linha de acordes <b>acima</b> da linha da letra, alinhando com espaços. A linha de acordes é reconhecida e ganha a cor dourada.</li>
<li>Toque em <b>Salvar</b> para guardar ou em <b>Cancelar</b> para sair sem alterar.</li></ul></details>
<details><summary>Setlists</summary><ul>
<li>Digite um nome e toque em <b>Criar</b>.</li>
<li>Dentro da setlist: <b>Renomear</b>, <b>↑ ↓</b> para ordenar, <b>✕</b> para remover a música da lista (a cifra não é apagada), <b>Adicionar música</b> e <b>Excluir setlist</b>.</li>
<li>"Marcar como compartilhada" é só uma marca na lista. Para enviar o repertório aos outros músicos, use a aba Banda.</li>
<li>"Minhas cifras" mostra suas cifras salvas.</li></ul></details>
<details><summary>Web: importar cifras</summary>
<p>Há quatro caminhos. Em todos, confira o texto no campo "Conteúdo" antes de tocar em <b>Importar para minhas cifras</b>.</p><ol>
<li><b>Copiar e colar</b> (mais seguro): abra a cifra no site, copie e cole no campo "Conteúdo". Se o site entregar os acordes alinhados sobre a letra (como o Cifra Club), o alinhamento é mantido. Em alguns sites a cópia perde a posição dos acordes; nesse caso eles ficam na linha acima da letra, na ordem certa, mas sem alinhar à sílaba.</li>
<li><b>Link</b>: cole o endereço da página (ou o texto de compartilhamento com o link) e toque em <b>Buscar cifra pelo link</b>. Alguns sites bloqueiam a leitura; então use copiar e colar.</li>
<li><b>Arquivo</b>: toque em <b>Carregar arquivo do dispositivo</b>. Aceita TXT, DOCX (Word), PDF com texto, ChordPro, CRD e HTML. No PDF, os acordes são posicionados pela posição no documento. PDF digitalizado (imagem) não é lido, e o PDF precisa de internet para o leitor carregar.</li>
<li><b>Google e Bing</b>: pesquisam "música + cifra" em outra aba para você achar a página.</li></ol>
<p>O botão <b>☐ Importar somente os acordes, sem a letra</b> fica dourado e com ☑ quando ativado. As seções (Verso, Refrão etc.) são identificadas automaticamente.</p></details>
<details><summary>Público</summary><p>Mostra as cifras da comunidade que já vêm no aplicativo. Toque para abrir e use o tom, a fonte e a rolagem normalmente.</p></details>
<details><summary>Conta</summary><ul>
<li><b>Aparência</b>: Claro, Escuro ou Automático (segue o aparelho).</li>
<li><b>Restaurar exemplos</b>: <b>atenção</b>, troca todos os seus dados pelos exemplos iniciais e apaga suas cifras e setlists neste aparelho. Use só se tiver certeza.</li>
<li>As cifras ficam salvas no navegador deste aparelho. Limpar os dados do navegador apaga tudo; para ter as mesmas músicas em outros aparelhos use a aba Banda.</li></ul></details>
<details><summary>Banda: o que é e como funciona</summary><ul>
<li>Um músico é o <b>líder</b>: ele cria o grupo e recebe um <b>código</b>. Os outros entram no grupo com esse código.</li>
<li>O líder envia o repertório e as setlists para todos. Quando o líder <b>abre uma música</b>, ela abre sozinha na tela dos membros.</li>
<li>Atenção: ao entrar em um grupo, o repertório e as setlists do membro <b>são substituídos</b> pelos do líder neste aparelho. Faça a configuração em um aparelho de teste primeiro.</li>
<li>Ao fechar e reabrir o aplicativo, entre na conta e no grupo de novo com o código.</li>
<li>O repertório enviado tem limite de cerca de 850 KB. Acima disso o aplicativo avisa.</li></ul></details>
<details><summary>Banda: como configurar (passo a passo)</summary>
<p>A sincronização usa o <b>Firebase</b> (serviço gratuito do Google). Você faz a configuração uma vez, e todos os músicos usam a mesma configuração.</p><ol>
<li>Entre em <b>console.firebase.google.com</b> com sua conta Google e toque em <b>Criar um projeto</b>. Dê um nome (por exemplo, SOS Cifras). O Google Analytics pode ficar desligado.</li>
<li>Na página do projeto, toque no ícone <b>&lt;/&gt;</b> (Web) para registrar um aplicativo. Dê um apelido. Não precisa marcar o Hosting.</li>
<li>O Firebase mostra um bloco <b>firebaseConfig</b>. Copie quatro valores: <b>apiKey</b>, <b>authDomain</b>, <b>projectId</b> e <b>appId</b>.</li>
<li>No SOS Cifras, aba <b>Banda</b>, cole os quatro valores nos campos API Key, Auth Domain, Project ID e App ID e toque em <b>Salvar configuração</b>. Isso fica salvo só neste aparelho; faça o mesmo nos outros aparelhos.</li>
<li>No Firebase, vá em <b>Authentication → Começar → Método de login</b>, ative <b>E-mail/senha</b> e salve.</li>
<li>No Firebase, vá em <b>Firestore Database → Criar banco de dados</b>. Escolha uma região (por exemplo, São Paulo) e inicie em modo de produção.</li>
<li>No Firestore, abra a aba <b>Regras</b>, apague o texto e cole as regras abaixo. Toque em <b>Publicar</b>. Sem as regras publicadas, a sincronização não funciona.</li></ol>
<button class="btn ghost" style="width:100%" data-a="copyrules">Copiar as regras</button><div class="rules">${e(RULES)}</div>
<p>Se aparecer erro de domínio não autorizado, vá em <b>Authentication → Configurações → Domínios autorizados</b> e adicione o endereço onde o aplicativo está publicado (por exemplo, celsomartins251.github.io).</p><ol start="8">
<li><b>Líder</b>: na aba Banda, digite e-mail e senha e toque em <b>Criar conta</b> (ou <b>Entrar</b>). Depois toque em <b>Criar grupo e ser líder</b>. O código do grupo aparece no campo e na mensagem de status; passe-o aos músicos.</li>
<li><b>Membros</b>: configuram os quatro campos, criam a própria conta (ou entram), digitam o código em "Código do grupo" e tocam em <b>Entrar no grupo</b>.</li>
<li><b>Para atualizar</b>: depois de mudar o repertório, o líder toca em <b>Enviar repertório e setlists aos membros</b>. A música atual acompanha o líder automaticamente.</li></ol>
<p>Observação: eu não consegui testar essas regras no Firebase real. Depois de publicá-las, use a ferramenta "Simulador de regras" do Firestore, ou teste com dois aparelhos, antes de usar em apresentação.</p></details>
<details><summary>Dúvidas comuns</summary><ul>
<li><b>A cifra importada ficou desalinhada</b>: tente colar de um site que mantenha os acordes sobre a letra, ou importe o PDF do site. Você pode corrigir no editor (✎).</li>
<li><b>O link não importa</b>: o site pode bloquear a leitura. Copie a cifra e cole no campo.</li>
<li><b>Transposição</b>: o tom exibido é o tom original da cifra mais o deslocamento escolhido. Preencha o campo Tom ao criar ou importar para vê-lo.</li></ul></details>`}
function vConta(){return `<h1>Conta</h1><h2>Aparência</h2><div class="row"><button class="btn ghost" data-a="th" data-v="light">Claro</button><button class="btn ghost" data-a="th" data-v="dark">Escuro</button><button class="btn ghost" data-a="th" data-v="">Automático</button></div>
 <h2>Dados</h2><p style="color:var(--mute)">As cifras ficam salvas neste navegador. Para sincronizar outros aparelhos, use a aba Banda com Firebase configurado.</p><button class="btn ghost" data-a="reset">Restaurar exemplos</button>`}

function vSong(){const s=song(S.song);if(!s)return'';const cur=s.shift||0;
 const body=s.body.split('\n').filter(l=>s.type!=='chords'||/^\s*\[.+\]\s*$/.test(l)||isChordLine(l)||!l.trim()).map(l=>{const m=l.match(/^\s*\[(.+)\]\s*$/);if(m)return`<div class="sec">${e(m[1])}</div>`;
  return isChordLine(l)?`<div class="cs c">${e(trLine(l,cur))||' '}</div>`:`<div class="cs l">${e(l)||' '}</div>`}).join('');
 const k=s.k?nn(s.k.replace(/m$/,''),cur)+(/m$/.test(s.k)?'m':''):'—';
 const pos=S.ctx?S.ctx.i+1+'/'+S.ctx.ids.length:'';
 return `<div class="top"><div class="row"><button class="btn ghost fit" data-a="back">‹ Voltar</button><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(s.t)}</b><small style="color:var(--mute)">${e(s.a||'')}</small></div></div>
 <div class="tools"><button class="tb" data-a="tr" data-v="-1" aria-label="Baixar tom">−</button><span class="chip" style="padding:8px 12px">Tom ${e(k)}${cur?' ('+(cur>0?'+':'')+cur+')':''}</span><button class="tb" data-a="tr" data-v="1" aria-label="Subir tom">+</button>
 <button class="tb" data-a="fs" data-v="-1" aria-label="Diminuir fonte">A−</button><button class="tb" data-a="fs" data-v="1" aria-label="Aumentar fonte">A+</button>
 <button class="tb ${S.play?'on':''}" data-a="play" aria-label="Rolagem automática">${S.play?'❚❚':'▶'}</button><button class="tb ${s.fav?'on':''}" data-a="fav" aria-label="Favoritar">★</button>
 <button class="tb" data-a="edit" aria-label="Editar">✎</button><button class="tb ${S.pick?'on':''}" data-a="pick" aria-label="Adicionar à setlist">▤+</button><button class="tb" data-a="print" aria-label="Imprimir">⎙</button></div>
 ${S.pick?`<div class="tools">${D.sets.map(l=>`<button class="btn ghost" data-a="toset" data-v="${l.id}">${e(l.n)}</button>`).join('')||'<small>Crie uma setlist primeiro.</small>'}</div>`:''}</div>
 <div style="font-size:${S.fs}px">${body}</div>
 ${S.ctx?`<div class="seq"><button class="btn" data-a="prev" ${S.ctx.i<1?'disabled style="opacity:.4"':''}>‹ Anterior</button><span class="btn ghost" style="min-width:64px;text-align:center">${pos}</span><button class="btn" data-a="next" ${S.ctx.i>=S.ctx.ids.length-1?'disabled style="opacity:.4"':''}>Próxima ›</button></div>`:''}`}
function vEdit(){const s=S.edit;return `<div class="top"><div class="row"><button class="btn ghost fit" data-a="cancel">Cancelar</button><button class="btn fit" data-a="save">Salvar</button></div></div><h1>${song(s.id)?'Editar cifra':'Nova cifra'}</h1>
 <label for="et">Título</label><input id="et" value="${e(s.t)}"><div class="row"><div><label for="ea">Artista</label><input id="ea" value="${e(s.a)}"></div><div><label for="ek">Tom</label><input id="ek" value="${e(s.k)}" placeholder="Ex.: G"></div></div>
 <label for="etype">Formato da cifra</label><select id="etype"><option value="lyrics" ${(s.type||'lyrics')==='lyrics'?'selected':''}>Acordes com letra</option><option value="chords" ${s.type==='chords'?'selected':''}>Somente acordes, sem letra</option></select>

 const q=document.getElementById('q'),f=q&&document.activeElement===q,pos=q&&q.selectionStart;

 tabs();if(f){const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
function stopIfLeft(){if(!S.song&&S.play)stopPlay()}
let toastTimer=null;
function toast(m){
 const previous=document.querySelector('.toast');if(previous)previous.remove();
 const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=String(m);
 document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),Math.max(1800,String(m).length*60));
}

document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;render()}});
document.addEventListener('change',ev=>{if(ev.target.id==='wfile'&&ev.target.files?.[0]){const inp=ev.target;loadChordFile(inp.files[0]).catch(err=>{console.error('Falha ao carregar arquivo:',err);toast(err?.message||'Não foi possível ler esse arquivo.');}).finally(()=>{inp.value='';});}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 const s=S.song&&song(S.song),l=S.sl&&D.sets.find(x=>x.id===S.sl);
 switch(a){
 case'tab':S.tab=v;S.song=null;S.edit=null;S.sl=null;S.ctx=null;render();window.scrollTo(0,0);break;
 case'copyrules':navigator.clipboard?.writeText(RULES).then(()=>toast('Regras copiadas. Cole no Firebase.'),()=>toast('Não consegui copiar. Selecione o texto e copie.'));break;
 case'webgoogle':case'webbing':{const q=document.getElementById('webq').value.trim();if(q)window.open((a==='webgoogle'?'https://www.google.com/search?q=':'https://www.bing.com/search?q=')+encodeURIComponent(q+' cifra'),'_blank','noopener');break}
 case'only':{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=(on?'☑ ':'☐ ')+'Importar somente os acordes, sem a letra';b.classList.toggle('ghost',!on);toast(on?'Ativado: somente acordes':'Desativado: cifra completa');break}
 case'webfetch':importFromLink();break;
 case'filepick':document.getElementById('wfile')?.click();break;
 case'webimport':{const t=document.getElementById('wtitle').value.trim(),ar=document.getElementById('wartist').value.trim(),k=document.getElementById('wkey').value.trim(),only=onlyChords(),body=organizeImportedText(document.getElementById('wbody').value,only);if(!t||!body){toast('Informe o título e o conteúdo da cifra.');break}const x={id:uid(),t,a:ar,k,body,type:only?'chords':'lyrics',src:'mine',fav:0,shift:0};D.songs.unshift(x);save();S.tab='busca';S.q='';openSong(x.id);toast(only?'Importada somente com acordes':'Cifra importada');break}
 case'fbconfig':D.firebase={apiKey:document.getElementById('fbapi').value.trim(),authDomain:document.getElementById('fbdom').value.trim(),projectId:document.getElementById('fbpid').value.trim(),appId:document.getElementById('fbapp').value.trim()};save();toast('Configuração salva neste dispositivo.');break;
 case'fbcreate':case'fblogin':case'fbjoin':case'fbgroup':case'fbsync':fbDo(a);break;
 case'renameset':{const n=prompt('Novo nome da setlist:',l.n);if(n&&n.trim()){l.n=n.trim();save();render()}break}
 case'open':openSong(v);break;
 case'back':if(S.song){S.song=null;S.ctx=null;stopPlay()}else if(S.sl)S.sl=null;render();break;
 case'new':S.edit={id:uid(),t:'',a:'',k:'',body:'[Verso]\n',type:'lyrics'};render();break;
 case'edit':S.edit={...s};S.song=null;render();break;
 case'cancel':S.edit=null;render();break;
 case'save':{const x=S.edit;x.t=document.getElementById('et').value.trim()||'Sem título';x.a=document.getElementById('ea').value.trim();x.k=document.getElementById('ek').value.trim();x.type=document.getElementById('etype').value;x.body=organizeImportedText(document.getElementById('eb').value,x.type==='chords');
  const i=D.songs.findIndex(y=>y.id===x.id);if(i<0)D.songs.unshift({...x,src:'mine',fav:0,shift:0});else D.songs[i]={...D.songs[i],...x};save();S.edit=null;S.song=x.id;toast('Cifra salva com sucesso');break}
 case'tr':s.shift=((s.shift||0)+ +v+12)%12;if(s.shift>6)s.shift-=12;save();render();break;
 case'fs':S.fs=Math.min(30,Math.max(11,S.fs+ +v*2));render();break;
 case'fav':s.fav=s.fav?0:1;save();render();break;
 case'play':if(S.play)stopPlay();else{S.play=1;timer=setInterval(()=>window.scrollBy(0,1),50)}render();break;
 case'pick':S.pick=S.pick?0:1;render();break;
 case'toset':{const t=D.sets.find(x=>x.id===v);if(!t.items.includes(s.id))t.items.push(s.id);save();S.pick=0;toast('Adicionada a “'+t.n+'”');break}
 case'print':window.print();break;
 case'prev':case'next':{const i=S.ctx.i+(a==='next'?1:-1);S.ctx.i=i;S.song=S.ctx.ids[i];stopPlay();render();window.scrollTo(0,0);break}
 case'oset':S.sl=v;render();break;
 case'favs':S.tab='busca';S.q='';render();break;
 case'openset':{const ids=l.items.filter(song);openSong(ids[+v],{ids,i:+v});break}
 case'mkset':{const n=document.getElementById('nl').value.trim();if(n){D.sets.unshift({id:uid(),n,items:[],shared:false});save();render()}break}
 case'addto':l.items.push(document.getElementById('addsel').value);save();render();break;
 case'up':case'down':{const i=+v,j=a==='up'?i-1:i+1;if(j>=0&&j<l.items.length){[l.items[i],l.items[j]]=[l.items[j],l.items[i]];save();render()}break}
 case'rm':l.items.splice(+v,1);save();render();break;
 case'share':l.shared=!l.shared;save();render();break;
 case'delset':D.sets=D.sets.filter(x=>x!==l);S.sl=null;save();render();break;
 case'th':D.theme=v;save();render();break;
 case'reset':D=JSON.parse(JSON.stringify(SEED));save();toast('Exemplos restaurados');break;
 }});

async function fbDo(action){
 const status=m=>{const x=document.getElementById('fbstatus');if(x)x.textContent=m;};
 try{
  const cfg=D.firebase||{};if(!cfg.apiKey||!cfg.projectId||!cfg.appId||!cfg.authDomain){status('Preencha e salve os quatro campos de configuração Firebase.');return}
  if(!FB){const [appM,authM,dbM]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);const app=appM.initializeApp(cfg,'soscifras');const auth=authM.getAuth(app);const db=dbM.getFirestore(app);FB={...appM,...authM,...dbM,app,auth,db};}
  const {auth,db,createUserWithEmailAndPassword,signInWithEmailAndPassword,doc,setDoc,getDoc,onSnapshot,updateDoc,arrayUnion}=FB;
  const email=document.getElementById('fbemail')?.value.trim(),pass=document.getElementById('fbpass')?.value;
  if(action==='fbcreate'){await createUserWithEmailAndPassword(auth,email,pass);status('Conta criada e conectada: '+auth.currentUser.email);return}
  if(action==='fblogin'){await signInWithEmailAndPassword(auth,email,pass);status('Conectado: '+auth.currentUser.email);return}
  if(!auth.currentUser){status('Entre na sua conta antes de criar ou acessar um grupo.');return}
  if(action==='fbgroup'){
   const payloadSize=JSON.stringify({songs:D.songs,sets:D.sets}).length;if(payloadSize>850000){status('Repertório muito grande para um único documento do Firestore. Reduza o conteúdo antes de criar o grupo.');return}const code=Math.random().toString(36).slice(2,10).toUpperCase();const ref=doc(db,'sos_cifras_groups',code);
   await setDoc(ref,{code,owner:auth.currentUser.uid,leader:auth.currentUser.uid,members:[auth.currentUser.uid],currentSong:null,songs:D.songs,sets:D.sets,updatedAt:Date.now()});
   S.band={code,role:'leader'};document.getElementById('fbcode').value=code;status('Grupo criado. Código para os músicos: '+code);fbListen(ref);return;
  }
  if(action==='fbjoin'){
   const code=document.getElementById('fbcode').value.trim().toUpperCase();const ref=doc(db,'sos_cifras_groups',code);const snap=await getDoc(ref);if(!snap.exists()){status('Código não encontrado.');return}await updateDoc(ref,{members:arrayUnion(auth.currentUser.uid)});S.band={code,role:'member'};status('Entrou no grupo '+code+'. Aguardando sincronização.');fbListen(ref);return;
  }
  if(action==='fbsync'){
   if(S.band?.role!=='leader'){status('Somente o líder pode enviar o repertório.');return}const payloadSize=JSON.stringify({songs:D.songs,sets:D.sets}).length;if(payloadSize>850000){status('Repertório muito grande para sincronizar em um único documento Firestore.');return}await updateDoc(doc(db,'sos_cifras_groups',S.band.code),{songs:D.songs,sets:D.sets,updatedAt:Date.now()});status('Repertório e setlists enviados ao grupo.');return;
  }
 }catch(err){console.error(err);status('Falha Firebase: '+(err.code||err.message||'erro desconhecido'));}
}
function fbListen(ref){if(fbUnsub)fbUnsub();fbUnsub=FB.onSnapshot(ref,snap=>{if(!snap.exists())return;const d=snap.data();if(S.band?.role!=='leader'){if(Array.isArray(d.songs))D.songs=d.songs;if(Array.isArray(d.sets))D.sets=d.sets;if(d.currentSong&&song(d.currentSong)){S.song=d.currentSong;S.tab='busca'}save();render()}const status=document.getElementById('fbstatus');if(status)status.textContent='Grupo '+d.code+' conectado · '+(d.leader===FB.auth.currentUser?.uid?'Você é líder':'sincronizado com o líder');},err=>{const status=document.getElementById('fbstatus');if(status)status.textContent='Erro na sincronização: '+err.message;});}
async function fbSyncCurrent(id){try{if(FB&&S.band?.role==='leader')await FB.updateDoc(FB.doc(FB.db,'sos_cifras_groups',S.band.code),{currentSong:id,updatedAt:Date.now()})}catch(e){console.error(e)}}

render();
</script>

s.addEventListener('click',close);document.addEventListener('keydown',close,{once:true});
