<style>
:root{--bg:#101010;--card:#1b1b1b;--ink:#f4f1e8;--mute:#aaa398;--line:#39342a;--brand:#d5aa42;--onbrand:#17130a;--chord:#f0c65b;--bar:#5a451b;--ok:#d5aa42}
:root[data-theme="light"]{--bg:#f6f3eb;--card:#ffffff;--ink:#24211b;--mute:#6f695e;--line:#d8d0c1;--brand:#9b741c;--onbrand:#fffdf7;--chord:#76540b;--bar:#9b741c;--ok:#9b741c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#f6f3eb;--card:#ffffff;--ink:#24211b;--mute:#6f695e;--line:#d8d0c1;--brand:#9b741c;--onbrand:#fffdf7;--chord:#76540b;--bar:#9b741c;--ok:#9b741c}}
:root[data-theme="dark"]{--bg:#101010;--card:#1b1b1b;--ink:#f4f1e8;--mute:#aaa398;--line:#39342a;--brand:#d5aa42;--onbrand:#17130a;--chord:#f0c65b;--bar:#5a451b}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:22px 0 8px}
.sub{color:var(--mute);text-align:center;margin:0 0 18px;font-size:14px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;min-height:300px;line-height:1.5}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;color:var(--ink);background:none}
.btn{background:var(--brand);color:var(--onbrand);border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:56px}
.item b{display:block;font-weight:600}.item small{color:var(--mute)}
.ico{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);display:grid;place-items:center;flex:none;font-weight:800}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin:-16px -16px 12px;padding:10px 16px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tb{min-width:44px;min-height:44px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:700}
.tb.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.sec{background:var(--bar);color:#fff;text-align:center;font-weight:600;font-size:14px;border-radius:8px;padding:5px;margin:18px 0 8px}
.cs{font-family:"JetBrains Mono",ui-monospace,monospace;white-space:pre;overflow-x:auto}
.c{color:var(--chord);font-weight:700}.l{color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs>div{display:flex;width:100%;max-width:760px;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);min-height:48px;justify-content:center}
.tab.on{color:var(--brand);font-weight:700}.tab .tabicon{font-size:22px;line-height:22px;height:22px;display:block}
.tab.mid{flex:none;width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--onbrand);margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:92vw}
.seq{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:4}
.seq .btn{box-shadow:0 3px 10px rgba(0,0,0,.2)}
label{font-size:13px;color:var(--mute);display:block;margin:12px 0 4px}
.sig{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding:12px 16px 0}
.sig span{color:var(--brand);font:600 24px/1.2 'Dancing Script','Segoe Script','Brush Script MT',cursive;letter-spacing:.01em}
.helpbtn{font:600 13px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--brand);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;min-height:36px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-bottom:8px}
summary{font-weight:600;padding:12px 0;cursor:pointer;min-height:44px}
details ul,details ol{padding-left:20px;margin:2px 0 12px}details li{margin:6px 0}details p{margin:4px 0 12px}
.rules{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;white-space:pre;overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 10px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}

/* Abertura com a imagem oficial e brilho dourado */
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#2a2110 0%,#101010 66%);overflow:hidden;opacity:1;visibility:visible;transition:opacity .65s ease,visibility .65s ease}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .glow{position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax 0 0 -70vmax;background:repeating-conic-gradient(from 0deg,rgba(240,198,91,.12) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);opacity:0}
#splash img{position:relative;display:block;width:min(72vw,72vh,390px);height:auto;max-width:78vw;max-height:78vh;object-fit:contain;border-radius:4px;opacity:0;transform:scale(.88);filter:drop-shadow(0 0 22px rgba(240,198,91,.28))}
#splash .bar{position:absolute;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));width:120px;height:3px;margin-left:-60px;border-radius:3px;background:rgba(213,170,66,.2);overflow:hidden;opacity:0}
#splash .bar i{display:block;height:100%;width:100%;background:#d5aa42;transform:scaleX(0);transform-origin:left}
@media (prefers-reduced-motion:no-preference){
#splash .glow{animation:sosGlow 2.6s ease-out .1s forwards,sosSpin 14s linear infinite}
#splash img{animation:sosLogoIn 1s cubic-bezier(.2,1.25,.4,1) .15s forwards}
#splash .bar{animation:sosFade .4s ease .5s forwards}
#splash .bar i{animation:sosLoad 1.9s ease-in-out .5s forwards}
@keyframes sosLogoIn{0%{opacity:0;transform:scale(.45) rotate(-8deg);filter:blur(8px) drop-shadow(0 0 10px rgba(240,198,91,.1))}60%{opacity:1;filter:blur(0) drop-shadow(0 0 28px rgba(240,198,91,.42))}100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0) drop-shadow(0 0 22px rgba(240,198,91,.28))}}
@keyframes sosGlow{0%{opacity:0}40%{opacity:1}100%{opacity:.55}}
@keyframes sosSpin{to{transform:rotate(360deg)}}
@keyframes sosFade{to{opacity:1}}
@keyframes sosLoad{to{transform:scaleX(1)}}}
@media (prefers-reduced-motion:reduce){#splash .glow,#splash img,#splash .bar{opacity:1}#splash .bar i{transform:scaleX(1)}}

</style>
<style>.chordTap{display:inline;cursor:pointer;color:inherit;font:inherit;font-weight:800;padding:0 1px;border-radius:4px;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--brand);text-underline-offset:3px}.chordTap:active{background:var(--brand);color:var(--onbrand)}.music-markers{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--brand);font-size:1.35em;font-weight:800;padding:5px 0}.music-markers span{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:2px 7px;border:1px solid var(--line);border-radius:7px}.mark-tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.mark-tools button{min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--brand);font-weight:700}.chord-panel-inline{display:block;position:relative;z-index:30;width:100%;margin:8px 0 14px}.chord-panel-card{width:min(100%,720px);max-height:none;overflow:visible;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 26px #0007}.chord-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.chord-panel-inline h3{margin:12px 0 6px;color:var(--brand);font-size:14px}.chord-panel-inline p{margin:5px 0;color:var(--mute);font-size:13px}.chord-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chord-option{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}.chord-option b{display:block;color:var(--brand);margin-bottom:4px}.chord-notes{font:13px/1.6 "JetBrains Mono",monospace;overflow-wrap:anywhere}.score-opening{display:flex;align-items:flex-end;gap:5px;min-height:2.5em;margin:6px 0 2px}.time-signature-inline{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;flex:none;width:max-content;min-width:25px;padding:0 4px;color:var(--brand);font-size:.95em;font-weight:800;line-height:.9}.time-signature-inline span:first-child{border-bottom:1px solid currentColor;padding:0 4px 3px}.time-signature-inline span:last-child{padding-top:3px}.score-opening>.cs{margin:0}.score-opening>.music-markers{margin:0;padding:0}.music-markers span.barline,.music-markers span.doublebar{border:0;border-radius:0;min-width:12px;padding:0 3px;font-size:1.35em;line-height:1.1}.music-markers span.doublebar{letter-spacing:-.22em;padding-right:7px}
.music-markers span.repeat-start,.music-markers span.repeat-end,.music-markers span.segno,.music-markers span.coda-symbol,.music-markers span.ds-coda{border:0;border-radius:0;min-width:0;padding:1px 4px;color:#ff3030;font-size:1.08em;font-weight:900}
.music-markers span.volta-marker{border:0;border-top:2px solid #ff3030;border-right:2px solid #ff3030;border-radius:0;min-width:3.1em;height:1.25em;margin:0 5px 2px 3px;padding:0;display:inline-flex;align-items:flex-start;justify-content:flex-start;font-size:.82em;color:#ff3030}
.music-markers span.volta-marker>span{position:relative;top:-.75em;left:-.05em;background:var(--bg);padding:0 3px}
/* Marcadores inline e exclusão por toque prolongado */
.music-inline-marker{display:inline-block;color:var(--brand);font-weight:800;padding:0 3px;white-space:pre}
.music-inline-marker.barline{font-size:1.2em;padding:0 4px}
.music-inline-marker.doublebar{font-size:1.2em;letter-spacing:-.18em;padding:0 7px 0 3px}
.music-inline-marker.repeat-start,.music-inline-marker.repeat-end,.music-inline-marker.segno,.music-inline-marker.coda-symbol{font-size:1.35em;line-height:1;vertical-align:middle;padding:0 3px;color:#ff3030;font-weight:900}
.music-inline-marker.volta-marker{display:inline-flex;position:relative;vertical-align:middle;align-items:flex-start;justify-content:flex-start;width:3.2em;height:1.35em;margin:0 .12em .05em .08em;padding:0;border-top:1.5px solid #ff3030;border-right:1.5px solid #ff3030;font-size:.82em;line-height:1;color:#ff3030;font-weight:800}
.music-inline-marker.volta-marker>span{position:relative;top:-.72em;left:-.05em;background:var(--bg);padding:0 2px}
.music-markers .volta-marker{display:inline-flex;position:relative;align-items:flex-start;justify-content:flex-start;width:3.2em;height:1.35em;margin:0 .12em .05em .08em;padding:0;border:0;border-top:1.5px solid #ff3030;border-right:1.5px solid #ff3030;border-radius:0;font-size:.82em;line-height:1;color:#ff3030}
.music-markers .volta-marker>span{position:relative;top:-.72em;left:-.05em;background:var(--bg);padding:0 2px}
.score-opening{align-items:center;gap:8px;min-height:2.8em;padding-top:2px}
.time-signature-inline{align-self:center;transform:translateY(-1px);min-width:28px;padding:0 3px}
.time-signature-inline span:first-child{padding:0 5px 4px}
.time-signature-inline span:last-child{padding-top:4px}

.meter-readout{white-space:nowrap}
.item[data-hold-delete="1"]{touch-action:pan-y;-webkit-touch-callout:none;user-select:none}
.delete-song-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.76)}
.delete-song-card{width:min(100%,380px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 12px 40px #0009}
.delete-song-card h3{margin:0 0 8px;color:var(--brand);font-size:18px}
.delete-song-card p{margin:0 0 18px;overflow-wrap:anywhere}
.delete-song-actions{display:flex;gap:10px;justify-content:flex-end}
.delete-song-actions button{min-width:108px}

/* Coda centralizada acima da barra de compasso */
.music-markers .coda-bar{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:16px;padding:0;border:0;border-radius:0;line-height:1;vertical-align:middle}
.music-markers .coda-symbol{display:inline-flex;align-items:center;justify-content:center;min-width:0;padding:0;border:0;border-radius:0;font-size:1.75em;line-height:.82;color:var(--brand);font-weight:900}
.music-markers .coda-bar .barline,.music-markers .coda-bar .doublebar{display:inline-flex;align-items:center;justify-content:center;min-width:12px;padding:0 3px;border:0;border-radius:0;font-size:1.35em;line-height:1.1}

/* Diagramas de acordes e escalas por instrumento */
.chord-panel-card{max-height:none}
.chord-panel-title{font-size:26px;font-weight:800;color:var(--brand)}
.instrument-label{display:block;margin:14px 0 5px;color:var(--mute);font-size:12px}
.chord-instrument{width:100%;min-height:44px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}
.chord-help{font-size:12px;color:var(--mute);margin:4px 0 10px}
.chord-shapes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.shape-card{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px}
.shape-card>b{display:block;color:var(--brand);font-size:14px}
.shape-card>small{display:block;color:var(--mute);font-size:10px;line-height:1.35;min-height:28px}
.shape-diagram{overflow:hidden}
.fret-svg{display:block;width:100%;height:auto;max-height:165px}
.fret-string{stroke:var(--mute);stroke-width:1.2}
.fret-line{stroke:var(--line);stroke-width:1.2}
.fret-nut{stroke:var(--brand);stroke-width:4}
.fret-dot{fill:var(--brand);stroke:var(--brand);stroke-width:1}
.fret-dot-text{fill:#17130a;font-size:7px;font-weight:800}
.fret-open{fill:var(--brand);font-size:14px;font-weight:800}
.fret-number{fill:var(--mute);font-size:9px}
.fret-string-names{text-align:center;color:var(--mute);font:9px "JetBrains Mono",monospace;white-space:nowrap}
.neck-unavailable{padding:24px 5px;color:var(--mute);font-size:12px}
.chord-theory{margin-top:12px}
.bass-neck{overflow-x:auto;padding:6px 0}
.bass-fret-head,.bass-row{display:grid;grid-template-columns:48px repeat(13,minmax(25px,1fr));gap:2px;min-width:390px}
.bass-fret-head{font-size:9px;color:var(--mute);margin-bottom:4px}
.bass-row{align-items:center;margin:3px 0}
.bass-row>b{color:var(--brand);font:700 12px "JetBrains Mono",monospace}
.bass-row>span{height:29px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;color:var(--mute);font:10px "JetBrains Mono",monospace}
.bass-row>span.scale-note{background:var(--brand);border-color:var(--brand);color:#17130a;font-weight:800}
.bass-legend{font-size:11px;color:var(--mute);margin:8px 0}
.bass-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:5px}
.chord-hover{position:relative;z-index:25;width:100%;max-width:560px;margin:8px 0 14px;background:var(--card);border:1px solid var(--brand);border-radius:12px;padding:10px;box-shadow:0 8px 24px #0007;color:var(--ink)}
.chord-hover>b{display:block;color:var(--brand);margin-bottom:6px}
.hover-shapes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hover-shapes>div{background:var(--bg);border-radius:7px;padding:4px;min-width:0}
.hover-shapes strong{font-size:11px;color:var(--brand)}
.chord-hover>small{color:var(--mute);font-size:10px}
@media(max-width:380px){.chord-shapes{gap:6px}.shape-card{padding:5px}.fret-string-names{font-size:8px}}
@media(hover:none){.chord-hover{display:none}}

.fret-barre{stroke:var(--brand);stroke-width:8;stroke-linecap:round;opacity:.9}

/* Escala no braço: visualização direta, sem nomes de notas. */
.chord-panel-card{padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px #0005}
.chord-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.scale-panel-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute)}
.chord-instrument{width:100%;min-height:38px;margin:0 0 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.scale-neck-wrap{width:100%;overflow-x:auto;padding:3px 0 8px}
.scale-neck{min-width:510px;padding:4px 3px}

.scale-fret-head{height:20px;margin-bottom:3px;color:var(--mute);font:9px "JetBrains Mono",monospace;text-align:center}
.scale-string-row{height:27px;position:relative}
.scale-string-row:before{content:"";position:absolute;left:12px;right:0;top:50%;height:1px;background:var(--mute);opacity:.8}
.scale-string-line{display:block}
.scale-fret-cell{height:27px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);position:relative;z-index:1}
.scale-fret-cell:last-child{border-right:1px solid var(--line)}
.scale-dot{display:block;width:12px;height:12px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 1px var(--onbrand);border:1px solid var(--brand)}
.scale-string-row:nth-child(2) .scale-fret-cell{border-top:2px solid var(--brand)}
.chord-panel-inline{margin:7px 0 12px}

/* Diagrama compacto de acorde, seguindo a referência visual enviada */
.chord-panel-inline{margin:8px auto 14px;max-width:330px}
.chord-panel-card{width:100%;padding:12px 14px 14px;background:#17191c;border:1px solid #292c31;border-radius:18px;box-shadow:0 8px 24px #0008}
.chord-panel-head{display:none}
.chord-instrument{margin:0 0 10px;min-height:40px;font-size:13px}
.chord-diagram-title{text-align:center;color:var(--ink);font-size:22px;font-weight:800;line-height:1.25;margin:4px 0 10px}
.scale-neck-host{width:100%;display:flex;justify-content:center}
.chord-diagram{width:100%;display:flex;justify-content:center;margin:0 auto;overflow:visible}
.chord-diagram-svg{display:block;width:auto;height:auto;max-width:100%;max-height:none;flex:none}

<style>/* SOS CIFRAS — dicionário de acordes (janela flutuante) v2.0.0 */
.scd{position:absolute;z-index:900;width:min(94vw,560px);overflow:auto;background:var(--card,#1b1b1b);color:var(--ink,#f4f1e8);border:1.5px solid var(--brand,#d5aa42);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.55);padding:10px 12px 8px;font:14px/1.35 "Bricolage Grotesque",system-ui,sans-serif;-webkit-overflow-scrolling:touch}
.scd-h{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.scd-t{display:block;font-size:22px;font-weight:800;color:var(--chord,#f0c65b);letter-spacing:-.01em}
.scd-h small{display:block;color:var(--mute,#aaa398);font-size:12.5px}
.scd-x{min-width:44px;min-height:44px;margin:-6px -6px 0 0;font-size:18px;border-radius:12px;color:var(--ink,#f4f1e8)}
.scd-bar{display:flex;gap:8px;margin:6px 0 8px}
.scd-sel{flex:1;min-height:44px;padding:8px 10px;border-radius:12px}
.scd-mode{min-width:84px;min-height:44px;border-radius:12px;border:1.5px solid var(--line,#39342a);font-weight:700;color:var(--brand,#d5aa42);background:var(--bg,#101010)}
.scd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:8px}
.scd-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg,#101010);border:1px solid var(--line,#39342a);border-radius:12px;padding:6px 4px 8px}
.scd-svg{width:100%;max-width:128px;height:auto}
.scd-meta{text-align:center;font-size:11.5px;line-height:1.25;color:var(--mute,#aaa398)}
.scd-meta b{display:block;color:var(--ink,#f4f1e8);font-weight:600}
.scd-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 6px;font-size:11.5px}
.scd-n i{font-style:normal;font-size:9.5px;color:var(--brand,#d5aa42);margin-left:2px;vertical-align:super}
.scd-play{min-height:44px;width:90%;border-radius:12px;background:var(--brand,#d5aa42);color:var(--onbrand,#17130a);font-weight:800}
.scd-play.on{outline:3px solid var(--chord,#f0c65b);outline-offset:2px}
.scd-src{position:absolute;top:4px;right:6px;font-size:9px;color:var(--mute,#aaa398)}

.scd-tab{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--line,#39342a);font-weight:600;font-size:12.5px;color:var(--ink,#f4f1e8);background:var(--bg,#101010)}
.scd-tab.on{background:var(--brand,#d5aa42);color:var(--onbrand,#17130a);border-color:var(--brand,#d5aa42)}
.scd-tab:disabled{opacity:.35}
.scd-note,.scd-empty{margin:2px 0 8px;font-size:12.5px;color:var(--mute,#aaa398)}
.scd-note b{color:var(--ink,#f4f1e8)}
.scd-foot{margin-top:8px;font-size:10.5px;color:var(--mute,#aaa398)}
.scd-foot a{color:var(--brand,#d5aa42)}
@media print{.scd{display:none}}
</style>

<style id="sos-print-and-volta-v2">

<style id="sos-cross-line-volta-v1">.score-sheet{position:relative}.score-row{position:relative;min-height:1.4em;overflow:visible}.score-row .music-markers{position:relative;z-index:1}.volta-label-inline{display:inline-block;color:#ff3030!important;-webkit-text-fill-color:#ff3030!important;font-weight:900;font-size:.9em;padding:0 5px;vertical-align:top}.volta-fragment{position:absolute;z-index:3;top:0;height:1.35em;border-top:2px solid #ff3030;pointer-events:none;box-sizing:border-box}.volta-fragment:not(.is-first){border-left:2px solid #ff3030}.volta-fragment.is-last{border-right:2px solid #ff3030}.volta-endpoint{position:absolute;top:-10px;width:26px;height:28px;border-radius:7px;background:rgba(255,48,48,.14);border:1px solid #ff3030;pointer-events:auto;touch-action:none;z-index:5}.volta-endpoint:after{content:"";position:absolute;left:10px;top:6px;width:4px;height:14px;border-radius:4px;background:#ff3030}.volta-endpoint.start{left:-13px}.volta-endpoint.end{right:-13px}.music-markers .segno,.music-inline-marker.segno{color:#ff3030!important;-webkit-text-fill-color:#ff3030!important;font-weight:900!important}@media print{.volta-endpoint{display:none!important}}</style>

function evaluate(inst,ch,frets){

function genFretted(inst,ch){

  const opts=[];

   for(let f=lo;f<=lo+inst.span;f++)if(ch.allowed.has((T[s]+f)%12))o.push(f);opts.push(o)}
  const fr=new Array(n).fill(-1);
  (function dfs(s,started,gap,interior){
   if(budget--<=0)return;
   if(s===n){const f=fr.filter(x=>x>0);
    if(f.length?Math.min(...f)!==lo:lo!==1)return;
    const k=fr.join(',');if(seen.has(k))return;

   for(const f of opts[s]){

    else{const ni=interior+(started?gap:0);if(ni>inst.maxInterior)continue;fr[s]=f;dfs(s+1,true,0,ni)}

function hamming(a,b){let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d}

function perms(a){if(a.length<=1)return[a];const r=[];a.forEach((x,i)=>perms(a.filter((_,j)=>j!==i)).forEach(p=>r.push([x,...p])));return r}

     const rangeMax=Math.max(...notes.map(x=>x.f));
     res.push({kind:'bass',notes,inv,minF:mn,maxF:Math.max(mx,extra?notes.find(x=>x.extra).f:0),avg,strings:sub.join(''),score:(adj?6:0)-(mx-mn)*.8-avg*.12+(extra?1:0),src:'calc',extra:!!extra});

  const directive=line.match(/^\s*\{([^:}]+):?\s*([^}]*)\}\s*$/);
  if(directive){
   const tag=directive[1].toLowerCase().trim(),value=directive[2].trim();
   if(['title','t'].includes(tag)){if(value)meta.title=value;continue;}
   if(['artist','subtitle','st'].includes(tag)){if(value)meta.artist=value;continue;}
   if(tag==='key'){if(value)meta.key=value;continue;}
   if(['start_of_verse','sov'].includes(tag)){out.push('[Verso]');continue;}
   if(['start_of_chorus','soc'].includes(tag)){out.push('[Refrão]');continue;}
   if(['start_of_bridge','sob'].includes(tag)){out.push('[Ponte]');continue;}
   if(['start_of_tab','sot','start_of_grid','sog'].includes(tag)){out.push('[Intro]');continue;}
   if(['end_of_verse','eov','end_of_chorus','eoc','end_of_bridge','eob','end_of_tab','eot','end_of_grid','eog','new_page'].includes(tag)){out.push('');continue;}
   if(['comment','c'].includes(tag)){if(value)out.push('['+value+']');continue;}
   continue;
  }
  let lyric='',chordLine='',last=0,found=false,m;
  const re=/\[([^\]\s]+)\]/g;
  while((m=re.exec(line))){
   const c=m[1];
   if(!chord.test(c))continue;
   const before=line.slice(last,m.index);lyric+=before;
   chordLine=chordLine.padEnd(lyric.length,' ')+c;
   found=true;last=re.lastIndex;
  }
  lyric+=line.slice(last);
  if(found){out.push(chordLine.trimEnd());if(lyric.trim())out.push(lyric);}
  else out.push(line);
 }
 return{body:out.join('\n'),meta};
}
function htmlFileToText(raw){
 const doc=new DOMParser().parseFromString(raw,'text/html');
 doc.querySelectorAll('script,style,noscript,svg,nav,header,footer,button,input,select,textarea').forEach(n=>n.remove());
 doc.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));
 doc.querySelectorAll('p,div,section,article,li,tr,h1,h2,h3,h4').forEach(n=>n.append('\n'));
 return(doc.body?.textContent||'').replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
/* Páginas de cifra guardam a cifra em <pre>: textContent preserva o alinhamento dos acordes sobre a letra */
function extractFromHtml(html){
 const doc=new DOMParser().parseFromString(html,'text/html');
 doc.querySelectorAll('script,style,noscript').forEach(n=>n.remove());
 doc.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));
 const title=((doc.querySelector('h1')?.textContent)||(doc.title||'').split(/\s[-–|]\s/)[0]||'').trim();
 const artist=(doc.querySelector('h2 a')?.textContent||'').trim();
 const pre=[...doc.querySelectorAll('pre')].sort((a,b)=>b.textContent.length-a.textContent.length)[0];

 return{title,artist,text};
}
async function docxToText(buf){
 const u=new Uint8Array(buf),dv=new DataView(buf);
 let p=u.length-22;while(p>=0&&dv.getUint32(p,true)!==0x06054b50)p--;
 if(p<0)throw new Error('Arquivo DOCX inválido ou corrompido.');
 const n=dv.getUint16(p+10,true);let o=dv.getUint32(p+16,true);
 for(let i=0;i<n;i++){
  const method=dv.getUint16(o+10,true),csize=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
  const name=new TextDecoder().decode(u.subarray(o+46,o+46+nl));
  if(name==='word/document.xml'){
   const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u.subarray(start,start+csize);
   const xml=method===0?new TextDecoder().decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
   return xml.replace(/<w:tab\/>/g,'\u0001').replace(/<w:(?:br|cr)[^>]*\/>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/\u0001/g,'\t')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  }
  o+=46+nl+el+cl;
 }
 throw new Error('Não encontrei o texto dentro do DOCX.');
}

/* PDF: reconstrói linhas pela posição (x,y) de cada trecho; acordes alinhados à letra logo abaixo */
function pdfPageToLines(items,cw){
 const rows=[];
 items.filter(i=>i.str).sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const r=rows.find(r=>Math.abs(r.y-i.y)<=2.5);if(r)r.it.push(i);else rows.push({y:i.y,it:[i]})});
 rows.sort((a,b)=>b.y-a.y);
 rows.forEach(r=>{r.it.sort((a,b)=>a.x-b.x);const l=r.it[r.it.length-1];r.min=r.it[0].x;r.max=l.x+l.w;r.chord=isChordLine(r.it.map(i=>i.str).join(' '))});
 const place=(r,origin,pc)=>{let s='',end=null;for(const i of r.it){const col=Math.max(0,Math.round((i.x-origin)/pc));
  if(s.length>col){if(end!==null&&i.x-end>pc*0.3&&!/\s$/.test(s)&&!/^\s/.test(i.str))s+=' ';s+=i.str}else s=s.padEnd(col,' ')+i.str;end=i.x+i.w}return s};
 rows.forEach(r=>{if(!r.chord){r.text=place(r,r.min,cw);r.pc=Math.max(1,(r.max-r.min)/Math.max(r.text.length,1))}});
 const left=Math.min(...rows.map(r=>r.min));
 rows.forEach((r,k)=>{if(r.chord){const n=rows.slice(k+1,k+3).find(x=>!x.chord);r.text=n?place(r,n.min,n.pc):place(r,left,cw)}});
 const gaps=rows.slice(1).map((r,k)=>rows[k].y-r.y).sort((a,b)=>a-b),med=gaps.length?gaps[gaps.length>>1]:12,out=[];
 rows.forEach((r,k)=>{if(k&&rows[k-1].y-r.y>med*1.9)out.push('');out.push(r.text.replace(/\s+$/,''))});
 return out;
}
let PDFJS=null;
async function loadPdfJs(){
 if(PDFJS)return PDFJS;
 const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
 const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar o leitor de PDF (é preciso internet).'));document.head.appendChild(s)});
 await load(base+'pdf.min.js');
 /* worker como <script> comum (sem blob/Worker): funciona dentro de sandbox e no GitHub Pages */
 await load(base+'pdf.worker.min.js');
 window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
 return PDFJS=window.pdfjsLib;
}
async function pdfToText(buf){
 const lib=await loadPdfJs(),pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise,pages=[];
 for(let n=1;n<=pdf.numPages;n++){const tc=await (await pdf.getPage(n)).getTextContent();pages.push(tc.items.map(i=>({str:i.str,x:i.transform[4],y:i.transform[5],w:i.width})))}
 const ws=pages.flat().filter(i=>i.str.trim().length>=4).map(i=>i.w/i.str.length).sort((a,b)=>a-b);
 const cw=ws.length?ws[ws.length>>1]:5;
 const text=pages.map(p=>pdfPageToLines(p,cw).join('\n')).join('\n\n').trim();
 if(!text)throw new Error('Este PDF não tem texto (parece digitalizado/imagem). Use um PDF gerado pelo site ou cole o texto.');
 return text;
}

 else if(ext==='pdf'||(await file.slice(0,5).text())==='%PDF-'){toast('Lendo o PDF…');source=await pdfToText(await file.arrayBuffer());}
 else{
  const raw=await file.text(),head=raw.slice(0,2000);
  if(/\u0000/.test(head)||(head.match(/\ufffd/g)||[]).length>20)throw new Error('Formato não suportado. Use TXT, DOCX, PDF, ChordPro ou HTML (DOC antigo não é lido).');

/* ===== IMAGEM → CIFRA (OCR no aparelho com Tesseract.js; precisa de internet na 1ª leitura) ===== */
async function loadTesseract(){
 if(window.Tesseract)return window.Tesseract;
 await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar o leitor de imagem. É preciso internet na primeira vez.'));document.head.appendChild(s)});
 return window.Tesseract;
}
/* amplia, passa para tons de cinza, inverte print escuro e aumenta o contraste: melhora muito o OCR */
async function prepareImage(file){
 let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){bmp=await createImageBitmap(file)}
 const sc=Math.min(3,Math.max(1,2000/bmp.width)),cv=document.createElement('canvas');
 cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bmp,0,0,cv.width,cv.height);
 const im=cx.getImageData(0,0,cv.width,cv.height),d=im.data,hist=new Uint32Array(256);let sum=0;
 for(let i=0;i<d.length;i+=4){const g=Math.round(d[i]*.299+d[i+1]*.587+d[i+2]*.114);d[i]=g;hist[g]++;sum+=g}
 const n=d.length/4,inv=sum/n<110;
 const pct=p=>{let a=0;for(let v=0;v<256;v++){a+=hist[v];if(a>=n*p)return v}return 255};
 let lo=pct(.02),hi=pct(.98);if(inv){const l=255-hi;hi=255-lo;lo=l}if(hi-lo<40){lo=0;hi=255}
 for(let i=0;i<d.length;i+=4){let g=inv?255-d[i]:d[i];g=Math.max(0,Math.min(255,(g-lo)*255/(hi-lo)));d[i]=d[i+1]=d[i+2]=g}
 cx.putImageData(im,0,0);return cv;
}
async function imageToText(file){
 const T=await loadTesseract();toast('Preparando a imagem…');
 const cv=await prepareImage(file);
 const worker=await T.createWorker('por+eng',1,{logger:m=>{if(m.status==='recognizing text')toast('Lendo a imagem… '+Math.round(m.progress*100)+'%')}});
 try{
  const r=await worker.recognize(cv),words=(r.data.words||[]).filter(w=>w.text&&w.text.trim()&&w.bbox);
  if(!words.length)throw new Error('Não consegui ler texto nesta imagem. Tente uma foto mais nítida e reta.');
  const hs=words.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b),u=Math.max(1,hs[hs.length>>1]/10);
  /* mesma reconstrução usada no PDF: acordes ficam alinhados sobre a letra */
  const items=words.map(w=>({str:w.text.trim(),x:w.bbox.x0/u,y:-((w.bbox.y0+w.bbox.y1)/2)/u,w:(w.bbox.x1-w.bbox.x0)/u}));
  const ws=items.filter(i=>i.str.length>=4).map(i=>i.w/i.str.length).sort((a,b)=>a-b);
  return pdfPageToLines(items,ws.length?ws[ws.length>>1]:5).join('\n');
 }finally{await worker.terminate()}
}

async function fetchText(url,ms){
 let tm;
 const limit=new Promise((_,no)=>{tm=setTimeout(()=>no(new Error('tempo esgotado')),ms)});
 try{
  return await Promise.race([(async()=>{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()})(),limit]);
 }catch(err){throw new Error(err.message==='Failed to fetch'?'bloqueado (CORS/rede)':err.message)}
 finally{clearTimeout(tm)}
}
async function importFromLink(){
 const field=document.getElementById('wurl'),button=document.querySelector('[data-a="webfetch"]');
 const typed=field?.value.trim();
 if(!typed){toast('Cole o endereço da página da cifra.');return;}
 /* aceita texto de compartilhamento: "Oceano, de Djavan, no Site https://..." */
 const raw=(typed.match(/https?:\/\/[^\s"'<>]+/i)||[typed])[0];
 const hint=typed.match(/^(.+?),\s*de\s+(.+?),\s*no\s+/i);
 if(hint){setIfEmpty('wtitle',hint[1].trim());setIfEmpty('wartist',hint[2].trim())}
 if(raw!==typed)field.value=raw;
 let target;
 try{target=new URL(raw);if(!/^https?:$/.test(target.protocol))throw new Error('URL inválida');}
 catch(_){toast('Informe um link HTTPS ou HTTP válido.');return;}
 if(button){button.disabled=true;button.textContent='Buscando cifra…';}
 const enc=encodeURIComponent(target.href),only=onlyChords();
 /* todos os leitores correm ao mesmo tempo; vale o primeiro que trouxer acordes reconhecíveis */
 const readers=[
  ['AllOrigins','https://api.allorigins.win/raw?url='+enc],
  ['AllOrigins2','https://api.allorigins.win/get?url='+enc,'json'],
  ['CorsProxy','https://corsproxy.io/?url='+enc],
  ['CodeTabs','https://api.codetabs.com/v1/proxy/?quest='+enc],
  ['ThingProxy','https://thingproxy.freeboard.io/fetch/'+target.href],
  ['Jina','https://r.jina.ai/'+target.href]
 ];
 const attempt=async([name,url,mode])=>{
  try{
   let payload=await fetchText(url,12000);
   if(mode==='json')payload=(JSON.parse(payload).contents)||'';
   if(!payload||payload.length<200)throw new Error('resposta vazia');
   if(/Just a moment|cf-chl|Attention Required|captcha/i.test(payload.slice(0,4000))&&payload.length<30000)throw new Error('site protegido (anti-robô)');
   let source=payload,title='',artist='';
   if(/^\s*(?:<!doctype html|<html|<head|<body|<)/i.test(payload)){const x=extractFromHtml(payload);source=x.text;title=x.title;artist=x.artist;}
   else title=(payload.match(/^Title:\s*(.+)$/mi)||[])[1]||'';
   const body=organizeImportedText(source,only);
   if(!body||body.split('\n').filter(isChordLine).length<2)throw new Error('sem acordes reconhecíveis');
   return{name,body,title:title.replace(/\s*[-–|]\s*(Cifra Club|Cifras|Letras).*$/i,''),artist};
  }catch(err){throw new Error(name+': '+err.message)}
 };
 try{
  let r;
  try{r=await Promise.any(readers.map(attempt))}
  catch(agg){
   const fails=(agg.errors||[agg]).map(x=>x.message);console.error('Importação por link falhou',fails);
   toast(fails.every(f=>/bloqueado/.test(f))?'Conexão bloqueada pelo ambiente. Abra o app pelo endereço do GitHub Pages. Se continuar, use "Colar da área de transferência".':'Não consegui ler o link ('+fails.slice(0,3).join('; ')+'). Abra a página, copie a cifra e use "Colar da área de transferência".');
   return;
  }
  fillMeta({title:r.title,artist:r.artist},'');setBody(r.body);
  toast('Cifra recebida via '+r.name+'. Confira antes de importar.');
 }finally{
  if(button){button.disabled=false;button.textContent='Buscar cifra pelo link';}
 }
}

const RULES=`rules_version = '2';
service cloud.firestore {

function vAjuda(){return `<h1>Ajuda</h1><p class="sub" style="text-align:left">Toque em um assunto para abrir. Tudo o que o aplicativo faz está explicado aqui.</p>
<details open><summary>Visão geral das abas</summary><ul>
<li><b>Público</b>: cifras da comunidade.</li><li><b>Setlists</b>: seus repertórios (listas de músicas para o culto, ensaio ou show).</li><li><b>Web</b>: importar cifras por pesquisa, link, texto copiado ou arquivo.</li><li><b>Busca</b> (botão redondo): procurar suas cifras pelo título ou artista e criar cifras novas.</li><li><b>Banda</b>: sincronizar repertório e música atual entre os aparelhos do grupo.</li><li><b>Conta</b>: aparência (claro, escuro ou automático) e restauração dos exemplos.</li></ul></details>
<details><summary>Busca e cifra aberta</summary><ul>
<li>Digite o título ou o artista. Suas cifras aparecem em "Suas cifras" e as da comunidade em "Comunidade". Toque em uma música para abrir.</li>
<li><b>− e +</b>: baixam ou sobem o tom, meio tom por toque. Os acordes são recalculados, inclusive baixos como D/F# e extensões como Em7/9.</li>
<li><b>A− e A+</b>: diminuem ou aumentam o tamanho da letra.</li>
<li><b>▶ / ❚❚</b>: ligam e pausam a rolagem automática.</li>
<li><b>★</b>: marca ou desmarca como favorita.</li>
<li><b>✎</b>: edita a cifra.</li>
<li><b>▤+</b>: adiciona a música a uma setlist.</li>
<li><b>⎙</b>: imprime ou salva em PDF pelo recurso do aparelho.</li>
<li>Dentro de uma setlist, os botões <b>‹ Anterior</b> e <b>Próxima ›</b> aparecem embaixo para passar de música sem voltar à lista.</li></ul></details>
<details><summary>Criar e editar cifras</summary><ul>
<li>Na Busca, toque em <b>Criar cifra manualmente</b>. Preencha título, artista e tom, escolha o formato e escreva ou cole a cifra.</li>
<li><b>Formato</b>: "Acordes com letra" mantém letra e acordes; "Somente acordes" mostra só os acordes.</li>
<li>Para separar as partes use <b>[Intro]</b>, <b>[Verso]</b>, <b>[Refrão]</b>, <b>[Ponte]</b> e <b>[Final]</b> em linha própria. Elas aparecem como faixas coloridas.</li>
<li>Escreva a linha de acordes <b>acima</b> da linha da letra, alinhando com espaços. A linha de acordes é reconhecida e ganha a cor dourada.</li>
<li>Toque em <b>Salvar</b> para guardar ou em <b>Cancelar</b> para sair sem alterar.</li></ul></details>
<details><summary>Setlists</summary><ul>
<li>Digite um nome e toque em <b>Criar</b>.</li>
<li>Dentro da setlist: <b>Renomear</b>, <b>↑ ↓</b> para ordenar, <b>✕</b> para remover a música da lista (a cifra não é apagada), <b>Adicionar música</b> e <b>Excluir setlist</b>.</li>
<li>"Marcar como compartilhada" é só uma marca na lista. Para enviar o repertório aos outros músicos, use a aba Banda.</li>
<li>"Minhas cifras" mostra suas cifras salvas.</li></ul></details>
<details><summary>Web: importar cifras</summary>
<p>Há quatro caminhos. Em todos, confira o texto no campo "Conteúdo" antes de tocar em <b>Importar para minhas cifras</b>.</p><ol>
<li><b>Copiar e colar</b> (mais seguro): abra a cifra no site, copie e cole no campo "Conteúdo". Se o site entregar os acordes alinhados sobre a letra (como o Cifra Club), o alinhamento é mantido. Em alguns sites a cópia perde a posição dos acordes; nesse caso eles ficam na linha acima da letra, na ordem certa, mas sem alinhar à sílaba.</li>
<li><b>Link</b>: cole o endereço da página (ou o texto de compartilhamento com o link) e toque em <b>Buscar cifra pelo link</b>. Alguns sites bloqueiam a leitura; então use copiar e colar.</li>
<li><b>Arquivo</b>: toque em <b>Carregar arquivo do dispositivo</b>. Aceita TXT, DOCX (Word), PDF com texto, ChordPro, CRD e HTML. No PDF, os acordes são posicionados pela posição no documento. PDF digitalizado (imagem) não é lido, e o PDF precisa de internet para o leitor carregar.</li>
<li><b>Imagem</b>: toque em <b>Ler cifra de uma imagem</b> e escolha uma foto ou print da cifra. O app lê o texto (OCR) e tenta manter os acordes sobre a letra. Precisa de internet na primeira leitura; use imagem nítida, reta e só com a cifra. Sempre confira e corrija antes de importar.</li><li><b>Colar da área de transferência</b>: copie a cifra no site e toque neste botão para colar e organizar.</li>
<li><b>Google e Bing</b>: pesquisam "música + cifra" em outra aba para você achar a página.</li></ol>
<p>O botão <b>☐ Importar somente os acordes, sem a letra</b> fica dourado e com ☑ quando ativado. As seções (Verso, Refrão etc.) são identificadas automaticamente.</p></details>
<details><summary>Público</summary><p>Mostra as cifras da comunidade que já vêm no aplicativo. Toque para abrir e use o tom, a fonte e a rolagem normalmente.</p></details>
<details><summary>Conta</summary><ul>
<li><b>Aparência</b>: Claro, Escuro ou Automático (segue o aparelho).</li>
<li><b>Restaurar exemplos</b>: <b>atenção</b>, troca todos os seus dados pelos exemplos iniciais e apaga suas cifras e setlists neste aparelho. Use só se tiver certeza.</li>
<li>As cifras ficam salvas no navegador deste aparelho. Limpar os dados do navegador apaga tudo; para ter as mesmas músicas em outros aparelhos use a aba Banda.</li></ul></details>
<details><summary>Banda: o que é e como funciona</summary><ul>
<li>Um músico é o <b>líder</b>: ele cria o grupo e recebe um <b>código</b>. Os outros entram no grupo com esse código.</li>
<li>O líder envia o repertório e as setlists para todos. Quando o líder <b>abre uma música</b>, ela abre sozinha na tela dos membros.</li>
<li>Atenção: ao entrar em um grupo, o repertório e as setlists do membro <b>são substituídos</b> pelos do líder neste aparelho. Faça a configuração em um aparelho de teste primeiro.</li>
<li>Ao fechar e reabrir o aplicativo, entre na conta e no grupo de novo com o código.</li>
<li>O repertório enviado tem limite de cerca de 850 KB. Acima disso o aplicativo avisa.</li></ul></details>
<details><summary>Banda: como configurar (passo a passo)</summary>
<p>A sincronização usa o <b>Firebase</b> (serviço gratuito do Google). Você faz a configuração uma vez, e todos os músicos usam a mesma configuração.</p><ol>
<li>Entre em <b>console.firebase.google.com</b> com sua conta Google e toque em <b>Criar um projeto</b>. Dê um nome (por exemplo, SOS Cifras). O Google Analytics pode ficar desligado.</li>
<li>Na página do projeto, toque no ícone <b>&lt;/&gt;</b> (Web) para registrar um aplicativo. Dê um apelido. Não precisa marcar o Hosting.</li>
<li>O Firebase mostra um bloco <b>firebaseConfig</b>. Copie quatro valores: <b>apiKey</b>, <b>authDomain</b>, <b>projectId</b> e <b>appId</b>.</li>
<li>No SOS Cifras, aba <b>Banda</b>, cole os quatro valores nos campos API Key, Auth Domain, Project ID e App ID e toque em <b>Salvar configuração</b>. Isso fica salvo só neste aparelho; faça o mesmo nos outros aparelhos.</li>
<li>No Firebase, vá em <b>Authentication → Começar → Método de login</b>, ative <b>E-mail/senha</b> e salve.</li>
<li>No Firebase, vá em <b>Firestore Database → Criar banco de dados</b>. Escolha uma região (por exemplo, São Paulo) e inicie em modo de produção.</li>
<li>No Firestore, abra a aba <b>Regras</b>, apague o texto e cole as regras abaixo. Toque em <b>Publicar</b>. Sem as regras publicadas, a sincronização não funciona.</li></ol>
<button class="btn ghost" style="width:100%" data-a="copyrules">Copiar as regras</button><div class="rules">${e(RULES)}</div>
<p>Se aparecer erro de domínio não autorizado, vá em <b>Authentication → Configurações → Domínios autorizados</b> e adicione o endereço onde o aplicativo está publicado (por exemplo, celsomartins251.github.io).</p><ol start="8">
<li><b>Líder</b>: na aba Banda, digite e-mail e senha e toque em <b>Criar conta</b> (ou <b>Entrar</b>). Depois toque em <b>Criar grupo e ser líder</b>. O código do grupo aparece no campo e na mensagem de status; passe-o aos músicos.</li>
<li><b>Membros</b>: configuram os quatro campos, criam a própria conta (ou entram), digitam o código em "Código do grupo" e tocam em <b>Entrar no grupo</b>.</li>
<li><b>Para atualizar</b>: depois de mudar o repertório, o líder toca em <b>Enviar repertório e setlists aos membros</b>. A música atual acompanha o líder automaticamente.</li></ol>
<p>Observação: eu não consegui testar essas regras no Firebase real. Depois de publicá-las, use a ferramenta "Simulador de regras" do Firestore, ou teste com dois aparelhos, antes de usar em apresentação.</p></details>
<details><summary>Dicionário de acordes e créditos</summary><ul><li>Toque em qualquer acorde da cifra: abre uma janela sobre a música com 3 a 4 posições, botão <b>PLAY</b> em cada uma e seletor de instrumento (violão 6 e 7 cordas, cavaquinho e contrabaixo).</li><li>No <b>contrabaixo</b> aparece somente a tríade (fundamental, terça e quinta), com fundamental, 1ª e 2ª inversão em várias regiões do braço. Em acordes com sétima ou extensão, mostra a tríade estrutural.</li><li>Acordes com baixo (D/F#, G/A…): o baixo indicado fica como nota mais grave da posição, quando existe posição possível.</li><li>Funciona offline depois do primeiro acesso.</li><li>Dados do violão: cálculo próprio validado nota a nota + Fretwork Guitar Dataset (guitarfretwork.com/data) e Haus of Chords, ambos CC BY 4.0.</li></ul></details>
<details><summary>Dúvidas comuns</summary><ul>
<li><b>A cifra importada ficou desalinhada</b>: tente colar de um site que mantenha os acordes sobre a letra, ou importe o PDF do site. Você pode corrigir no editor (✎).</li>
<li><b>O link não importa</b>: o site pode bloquear a leitura. Copie a cifra e cole no campo.</li>
<li><b>Transposição</b>: o tom exibido é o tom original da cifra mais o deslocamento escolhido. Preencha o campo Tom ao criar ou importar para vê-lo.</li></ul></details>`}

function vSong(){const s=song(S.song);if(!s)return'';const cur=s.shift||0;
 const lines=s.body.split('\n');
 const isSectionLine=l=>/^\s*\[.+\]\s*$/.test(l);
 const isMeterLine=l=>/^\s*⟦\d+\/\d+⟧\s*$/.test(l);
 const isContentLine=l=>l.trim()!==''&&!isSectionLine(l)&&!isMeterLine(l);
 const openingIndex=lines.findIndex(isContentLine);
 const meterAtLine={};
 lines.forEach((line,i)=>{const tm=line.match(/^\s*⟦(\d+\/\d+)⟧\s*$/);if(!tm)return;for(let n=i+1;n<lines.length;n++){if(isContentLine(lines[n])){meterAtLine[n]=tm[1];break;}}});
 const meterHtml=(value)=>{const meter=String(value||'4/4').split('/');return `<span class="time-signature-inline" aria-label="Fórmula de compasso ${e(value||'4/4')}"><span>${e(meter[0])}</span><span>${e(meter[1]||'4')}</span></span>`;};
 const voltaSegments={};
 lines.forEach((line,i)=>{
  if(!window.SOSChord.isNotationLine(line.trim()))return;
  line.trim().split(/\s+/).forEach(token=>{
   if(token!=="1ª"&&token!=="2ª")return;
   const key=String(i),raw=(s.voltaRanges||{})[key];
   const r=raw&&typeof raw==='object'?raw:{startLine:i,endLine:i,startPct:0,endPct:Number(raw||30)};
   const first=Math.max(0,Math.min(lines.length-1,Number(r.startLine??i)));
   const last=Math.max(first,Math.min(lines.length-1,Number(r.endLine??i)));
   for(let n=first;n<=last;n++){
    if(!voltaSegments[n])voltaSegments[n]=[];
    voltaSegments[n].push({key,label:token,left:n===first?Number(r.startPct||0):0,right:n===last?Number(r.endPct||30):100,first:n===first,last:n===last});
   }
  });
 });
 const body=lines.map((l,i)=>{const m=l.match(/^\s*\[(.+)\]\s*$/),tm=l.match(/^\s*⟦(\d+\/\d+)⟧\s*$/);let row;
  if(tm)return '';
  else if(m)row=`<div class="sec">${e(m[1])}</div>`;

  else row=`<div class="cs ${s.type==='chords'?'c':'l'}">${e(l)||' '}</div>`;
  const segments=(voltaSegments[i]||[]).map(r=>'<span class="volta-fragment '+(r.first?'is-first ':'')+(r.last?'is-last':'')+'" data-volta-left="'+r.left+'" data-volta-right="'+r.right+'" style="left:'+r.left+'%;width:'+Math.max(0,r.right-r.left)+'%">'+(r.first?'<span class="volta-label-inline">'+e(r.label)+'</span><span class="volta-endpoint start" data-volta-key="'+r.key+'" data-volta-endpoint="start" role="slider" aria-label="Mover início da chave" tabindex="0"></span>':'')+(r.last?'<span class="volta-endpoint end" data-volta-key="'+r.key+'" data-volta-endpoint="end" role="slider" aria-label="Mover fim da chave" tabindex="0"></span>':'')+'</span>').join('');
  const meterValue=meterAtLine[i]||(i===openingIndex?(s.meter||'4/4'):null);
  return '<div class="score-row" data-score-line="'+i+'">'+(meterValue?'<div class="score-opening">'+meterHtml(meterValue)+row+'</div>':row)+segments+'</div>';
 }).join('');
 const k=s.k?nn(s.k.replace(/m$/,''),cur)+(/m$/.test(s.k)?'m':''):'—';
 const pos=S.ctx?S.ctx.i+1+'/'+S.ctx.ids.length:'';
 return `<div class="print-header"><div class="print-brand">Celso Martins · Dicas de Música</div><h1>${e(s.t)}</h1></div><div class="top"><div class="row"><button class="btn ghost fit" data-a="back">‹ Voltar</button><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(s.t)}</b><small style="color:var(--mute)">${e(s.a||'')}</small></div></div>

 ${S.pick?`<div class="tools">${D.sets.map(l=>`<button class="btn ghost" data-a="toset" data-v="${l.id}">${e(l.n)}</button>`).join('')||'<small>Crie uma setlist primeiro.</small>'}</div>`:''}</div>
 <div style="font-size:${S.fs}px">${body}</div>
 ${S.ctx?`<div class="seq"><button class="btn" data-a="prev" ${S.ctx.i<1?'disabled style="opacity:.4"':''}>‹ Anterior</button><span class="btn ghost" style="min-width:64px;text-align:center">${pos}</span><button class="btn" data-a="next" ${S.ctx.i>=S.ctx.ids.length-1?'disabled style="opacity:.4"':''}>Próxima ›</button></div>`:''}`}
function vEdit(){const s=S.edit;return `<div class="top"><div class="row"><button class="btn ghost fit" data-a="cancel">Cancelar</button><button class="btn fit" data-a="save">Salvar</button></div></div><h1>${song(s.id)?'Editar cifra':'Nova cifra'}</h1>

 <label for="eb">Conteúdo (use [Intro], [Verso], [Refrão], [Ponte] e [Final] para separar as partes)</label><div class="meter-tools" aria-label="Inserir fórmula de compasso em um ponto da música"><span>Inserir compasso no cursor:</span><button type="button" data-meter="2/4">2/4</button><button type="button" data-meter="3/4">3/4</button><button type="button" data-meter="4/4">4/4</button><button type="button" data-meter="6/8">6/8</button><button type="button" data-meter="7/8">7/8</button></div><div class="mark-tools" aria-label="Símbolos musicais"><button type="button" data-mark="|">| Barra de compasso</button><button type="button" data-mark="‖">‖ Barra dupla</button><button type="button" data-mark="𝄂">Barra dupla final</button><button type="button" data-mark="𝄆">𝄆 Ritornelo início</button><button type="button" data-mark="𝄇">𝄇 Ritornelo fim</button><button type="button" data-mark="1ª">1ª chave</button><button type="button" data-mark="2ª">2ª chave</button><button type="button" data-mark="𝄋">𝄋 Segno (S)</button><button type="button" data-mark="𝄌">𝄌 Coda</button><button type="button" data-mark="D.S. al Coda">D.S. al Coda</button></div><textarea id="eb" spellcheck="false">${e(s.body)}</textarea>`}

function render(){stopIfLeft();applyTheme();let h;
 if(S.edit)h=vEdit();else if(S.song)h=vSong();else h={busca:vBusca,pub:vPub,sets:vSets,web:vWeb,band:vBand,conta:vConta,ajuda:vAjuda}[S.tab]();
 const q=document.getElementById('q'),f=q&&document.activeElement===q,pos=q&&q.selectionStart;
 document.getElementById('app').innerHTML=h;
 tabs();requestAnimationFrame(fitVoltaFragments);if(f){const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
function stopIfLeft(){if(!S.song&&S.play)stopPlay()}
let toastTimer=null;
function toast(m){
 const previous=document.querySelector('.toast');if(previous)previous.remove();
 const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=String(m);
 document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),Math.max(1800,String(m).length*60));
}
function openSong(id,ctx){S.song=id;S.ctx=ctx||null;S.pick=0;stopPlay();render();window.scrollTo(0,0);if(S.band?.role==='leader')fbSyncCurrent(id)}

let songHoldTimer=null,songHoldTarget=null,suppressSongOpen=false,songHoldX=0,songHoldY=0;
function clearSongHold(){if(songHoldTimer)clearTimeout(songHoldTimer);songHoldTimer=null;songHoldTarget=null;}
function showDeleteSongPrompt(id){
 const x=song(id);if(!x||x.src==='com')return;
 document.querySelector('.delete-song-overlay')?.remove();
 const layer=document.createElement('div');layer.className='delete-song-overlay';
 layer.innerHTML=`<section class="delete-song-card" role="dialog" aria-modal="true" aria-label="Excluir música"><h3>Excluir música?</h3><p>${e(x.t)}</p><div class="delete-song-actions"><button class="btn ghost" data-a="delete-cancel">Cancelar</button><button class="btn" data-a="delete-confirm" data-v="${e(x.id)}">Excluir</button></div></section>`;
 document.body.appendChild(layer);
}
document.addEventListener('pointerdown',ev=>{
 if(suppressSongOpen&&!document.querySelector('.delete-song-overlay'))suppressSongOpen=false;
 const target=ev.target.closest('[data-hold-delete="1"]');if(!target)return;
 clearSongHold();songHoldTarget=target;songHoldX=ev.clientX;songHoldY=ev.clientY;
 const id=target.dataset.v;
 songHoldTimer=setTimeout(()=>{suppressSongOpen=true;showDeleteSongPrompt(id);songHoldTimer=null;},650);
});
document.addEventListener('pointerup',clearSongHold);
document.addEventListener('pointercancel',clearSongHold);
document.addEventListener('contextmenu',ev=>{if(ev.target.closest('[data-hold-delete="1"]'))ev.preventDefault();});
document.addEventListener('pointermove',ev=>{
 if(!songHoldTimer||!songHoldTarget)return;
 if(Math.abs(ev.clientX-songHoldX)>14||Math.abs(ev.clientY-songHoldY)>14)clearSongHold();
});

document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;render()}});
document.addEventListener('change',ev=>{if(ev.target.id==='wimg'&&ev.target.files?.[0]){const inp=ev.target;loadChordImage(inp.files[0]).catch(err=>{console.error('Falha ao ler imagem:',err);toast(err?.message||'Não foi possível ler esta imagem.');}).finally(()=>{inp.value='';});}});
document.addEventListener('change',ev=>{if(ev.target.id==='wfile'&&ev.target.files?.[0]){const inp=ev.target;loadChordFile(inp.files[0]).catch(err=>{console.error('Falha ao carregar arquivo:',err);toast(err?.message||'Não foi possível ler esse arquivo.');}).finally(()=>{inp.value='';});}});
document.addEventListener('change',ev=>{if(ev.target.id==='etype'&&S.edit){const area=document.getElementById('eb');if(area)S.edit.body=area.value;const meter=document.getElementById('emeter');if(meter)S.edit.meter=meter.value;S.edit.type=ev.target.value;render();}});

document.addEventListener('change',ev=>{
 if(ev.target&&ev.target.id==='printDark'){D.printDark=!!ev.target.checked;save();document.documentElement.classList.toggle('print-dark',D.printDark);}
});
function scoreRowContentWidth(row){
 const rows=[row];let next=row.previousElementSibling,prev=row.nextElementSibling;
 for(let n=0;n<5;n++){if(next&&next.matches('.score-row')){rows.push(next);next=next.previousElementSibling;}if(prev&&prev.matches('.score-row')){rows.push(prev);prev=prev.nextElementSibling;}}
 for(const candidate of rows){
  const node=candidate.querySelector('.cs,.music-markers');
  if(!node||!node.textContent.trim())continue;
  const chordNodes=node.querySelectorAll('[data-chord]');
  if(chordNodes.length){const rect=chordNodes[chordNodes.length-1].getBoundingClientRect();const base=row.getBoundingClientRect().left;return Math.max(28,rect.right-base);}
  const range=document.createRange();range.selectNodeContents(node);const rects=range.getClientRects();
  if(rects.length){const base=row.getBoundingClientRect().left;return Math.max(28,rects[rects.length-1].right-base);}
 }
 return Math.max(28,row.clientWidth||28);
}
function fitVoltaFragments(){
 document.querySelectorAll('.score-row .volta-fragment').forEach(fragment=>{
  const row=fragment.closest('.score-row');if(!row)return;
  const contentWidth=scoreRowContentWidth(row),left=Number(fragment.dataset.voltaLeft||0),right=Number(fragment.dataset.voltaRight||100);
  fragment.style.left=(contentWidth*left/100)+'px';
  fragment.style.width=(contentWidth*Math.max(0,right-left)/100)+'px';
 });
}
let voltaDrag=null;
function getVoltaRange(current,key){current.voltaRanges=current.voltaRanges||{};const v=current.voltaRanges[key];return v&&typeof v==='object'?{startLine:Number(v.startLine??key),endLine:Number(v.endLine??key),startPct:Number(v.startPct??0),endPct:Number(v.endPct??30)}:{startLine:Number(key),endLine:Number(key),startPct:0,endPct:Number(v||30)};}
document.addEventListener('pointerdown',ev=>{const h=ev.target.closest&&ev.target.closest('.volta-endpoint');if(!h)return;const current=song(S.song);if(!current)return;ev.preventDefault();voltaDrag={key:h.dataset.voltaKey,endpoint:h.dataset.voltaEndpoint,pointer:ev.pointerId};try{h.setPointerCapture(ev.pointerId)}catch(_){}});
document.addEventListener('pointerup',ev=>{if(!voltaDrag||ev.pointerId!==voltaDrag.pointer)return;const state=voltaDrag;voltaDrag=null;const current=song(S.song);if(!current)return;const target=document.elementFromPoint(ev.clientX,ev.clientY);const row=target&&target.closest?target.closest('[data-score-line]'):null;if(!row)return;const line=Number(row.dataset.scoreLine),rect=row.getBoundingClientRect(),contentWidth=scoreRowContentWidth(row),pct=Math.max(0,Math.min(100,(ev.clientX-rect.left)/Math.max(1,contentWidth)*100)),r=getVoltaRange(current,state.key);if(state.endpoint==='start'){r.startLine=Math.min(line,r.endLine);r.startPct=pct;if(r.startLine===r.endLine&&r.startPct>r.endPct)r.startPct=r.endPct;}else{r.endLine=Math.max(line,r.startLine);r.endPct=pct;if(r.endLine===r.startLine&&r.endPct<r.startPct)r.endPct=r.startPct;}current.voltaRanges[state.key]=r;save();render();toast('Extensão da chave salva entre as linhas.');});
document.addEventListener('pointercancel',()=>{voltaDrag=null});
document.addEventListener('keydown',ev=>{const h=ev.target.closest&&ev.target.closest('.volta-endpoint');if(!h||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key))return;ev.preventDefault();const current=song(S.song);if(!current)return;const key=h.dataset.voltaKey,r=getVoltaRange(current,key),step=ev.shiftKey?5:1;if(h.dataset.voltaEndpoint==='start'){if(ev.key==='ArrowLeft')r.startPct=Math.max(0,r.startPct-step);if(ev.key==='ArrowRight')r.startPct=Math.min(r.endPct,r.startPct+step);if(ev.key==='ArrowUp')r.startLine=Math.max(0,r.startLine-1);if(ev.key==='ArrowDown')r.startLine=Math.min(r.endLine,r.startLine+1);}else{if(ev.key==='ArrowLeft')r.endPct=Math.max(r.startLine===r.endLine?r.startPct:0,r.endPct-step);if(ev.key==='ArrowRight')r.endPct=Math.min(100,r.endPct+step);if(ev.key==='ArrowUp')r.endLine=Math.max(r.startLine,r.endLine-1);if(ev.key==='ArrowDown')r.endLine=Math.min(999,r.endLine+1);}current.voltaRanges[key]=r;save();render();});

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;if(suppressSongOpen){suppressSongOpen=false;if(b.dataset.holdDelete==='1'&&b.dataset.a==='open'){ev.preventDefault();return;}}const a=b.dataset.a,v=b.dataset.v;
 const s=S.song&&song(S.song),l=S.sl&&D.sets.find(x=>x.id===S.sl);
 switch(a){
 case'tab':S.tab=v;S.song=null;S.edit=null;S.sl=null;S.ctx=null;render();window.scrollTo(0,0);break;
 case'copyrules':navigator.clipboard?.writeText(RULES).then(()=>toast('Regras copiadas. Cole no Firebase.'),()=>toast('Não consegui copiar. Selecione o texto e copie.'));break;
 case'webgoogle':case'webbing':{const q=document.getElementById('webq').value.trim();if(q)window.open((a==='webgoogle'?'https://www.google.com/search?q=':'https://www.bing.com/search?q=')+encodeURIComponent(q+' cifra'),'_blank','noopener');break}
 case'only':{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=(on?'☑ ':'☐ ')+'Importar somente os acordes, sem a letra';b.classList.toggle('ghost',!on);toast(on?'Ativado: somente acordes':'Desativado: cifra completa');break}
 case'webfetch':importFromLink();break;
 case'filepick':document.getElementById('wfile')?.click();break;
 case'imgpick':document.getElementById('wimg')?.click();break;
 case'paste':pasteFromClipboard();break;
 case'webimport':{const t=document.getElementById('wtitle').value.trim(),ar=document.getElementById('wartist').value.trim(),k=document.getElementById('wkey').value.trim(),only=onlyChords(),body=organizeImportedText(document.getElementById('wbody').value,only);if(!t||!body){toast('Informe o título e o conteúdo da cifra.');break}const x={id:uid(),t,a:ar,k,body,type:only?'chords':'lyrics',src:'mine',fav:0,shift:0};D.songs.unshift(x);save();S.tab='busca';S.q='';openSong(x.id);toast(only?'Importada somente com acordes':'Cifra importada');break}
 case'fbconfig':D.firebase={apiKey:document.getElementById('fbapi').value.trim(),authDomain:document.getElementById('fbdom').value.trim(),projectId:document.getElementById('fbpid').value.trim(),appId:document.getElementById('fbapp').value.trim()};save();toast('Configuração salva neste dispositivo.');break;
 case'fbcreate':case'fblogin':case'fbjoin':case'fbgroup':case'fbsync':fbDo(a);break;
 case'renameset':{const n=prompt('Novo nome da setlist:',l.n);if(n&&n.trim()){l.n=n.trim();save();render()}break}
 case'open':openSong(v);break;
 case'delete-cancel':document.querySelector('.delete-song-overlay')?.remove();break;
 case'delete-confirm':{const target=song(v);document.querySelector('.delete-song-overlay')?.remove();if(!target||target.src==='com'){toast('Esta música não pode ser excluída por aqui.');break;}D.songs=D.songs.filter(x=>x.id!==v);D.sets.forEach(set=>{set.items=set.items.filter(id=>id!==v)});if(S.song===v){S.song=null;S.ctx=null;stopPlay()}save();render();toast('Música excluída.');break}
 case'back':if(S.song){S.song=null;S.ctx=null;stopPlay()}else if(S.sl)S.sl=null;render();break;
 case'new':S.edit={id:uid(),t:'',a:'',k:'',body:'[Verso]\n',type:'lyrics'};render();break;
 case'edit':S.edit={...s};S.song=null;render();break;
 case'cancel':S.edit=null;render();break;
 case'save':{const x=S.edit;x.t=document.getElementById('et').value.trim()||'Sem título';x.a=document.getElementById('ea').value.trim();x.k=document.getElementById('ek').value.trim();x.meter=(document.getElementById('emeter').value||'4/4').replace(/\s+/g,'');if(!/^\d+\/\d+$/.test(x.meter)||x.meter.split('/').some(n=>+n<1)){toast('Informe uma fórmula de compasso válida, por exemplo 4/4 ou 7/8.');break;}x.type=document.getElementById('etype').value;x.body=organizeImportedText(document.getElementById('eb').value,x.type==='chords');
  const i=D.songs.findIndex(y=>y.id===x.id);if(i<0)D.songs.unshift({...x,src:'mine',fav:0,shift:0});else D.songs[i]={...D.songs[i],...x};save();S.edit=null;S.song=x.id;toast('Cifra salva com sucesso');break}
 case'tr':s.shift=((s.shift||0)+ +v+12)%12;if(s.shift>6)s.shift-=12;save();render();break;
 case'fs':S.fs=Math.min(30,Math.max(11,S.fs+ +v*2));render();break;
 case'fav':s.fav=s.fav?0:1;save();render();break;
 case'play':if(S.play)stopPlay();else{S.play=1;timer=setInterval(()=>window.scrollBy(0,S.scrollSpeed),50)}render();break;
  case'scroll-speed':S.scrollSpeed=Math.max(1,Math.min(10,S.scrollSpeed+(+v)));if(S.play){clearInterval(timer);timer=setInterval(()=>window.scrollBy(0,S.scrollSpeed),50)}render();break;
 case'pick':S.pick=S.pick?0:1;render();break;
 case'toset':{const t=D.sets.find(x=>x.id===v);if(!t.items.includes(s.id))t.items.push(s.id);save();S.pick=0;toast('Adicionada a “'+t.n+'”');break}
 case'print':document.documentElement.classList.toggle('print-dark',!!D.printDark);window.print();break;
 case'prev':case'next':{const i=S.ctx.i+(a==='next'?1:-1);S.ctx.i=i;S.song=S.ctx.ids[i];stopPlay();render();window.scrollTo(0,0);break}
 case'oset':S.sl=v;render();break;
 case'favs':S.tab='busca';S.q='';render();break;
 case'openset':{const ids=l.items.filter(song);openSong(ids[+v],{ids,i:+v});break}
 case'mkset':{const n=document.getElementById('nl').value.trim();if(n){D.sets.unshift({id:uid(),n,items:[],shared:false});save();render()}break}
 case'addto':l.items.push(document.getElementById('addsel').value);save();render();break;
 case'up':case'down':{const i=+v,j=a==='up'?i-1:i+1;if(j>=0&&j<l.items.length){[l.items[i],l.items[j]]=[l.items[j],l.items[i]];save();render()}break}
 case'rm':l.items.splice(+v,1);save();render();break;
 case'share':l.shared=!l.shared;save();render();break;
 case'delset':D.sets=D.sets.filter(x=>x!==l);S.sl=null;save();render();break;
 case'th':D.theme=v;save();render();break;
 case'reset':D=JSON.parse(JSON.stringify(SEED));save();toast('Exemplos restaurados');break;
 }});

async function fbDo(action){
 const status=m=>{const x=document.getElementById('fbstatus');if(x)x.textContent=m;};
 try{
  const cfg=D.firebase||{};if(!cfg.apiKey||!cfg.projectId||!cfg.appId||!cfg.authDomain){status('Preencha e salve os quatro campos de configuração Firebase.');return}
  if(!FB){const [appM,authM,dbM]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);const app=appM.initializeApp(cfg,'soscifras');const auth=authM.getAuth(app);const db=dbM.getFirestore(app);FB={...appM,...authM,...dbM,app,auth,db};}
  const {auth,db,createUserWithEmailAndPassword,signInWithEmailAndPassword,doc,setDoc,getDoc,onSnapshot,updateDoc,arrayUnion}=FB;
  const email=document.getElementById('fbemail')?.value.trim(),pass=document.getElementById('fbpass')?.value;
  if(action==='fbcreate'){await createUserWithEmailAndPassword(auth,email,pass);status('Conta criada e conectada: '+auth.currentUser.email);return}
  if(action==='fblogin'){await signInWithEmailAndPassword(auth,email,pass);status('Conectado: '+auth.currentUser.email);return}
  if(!auth.currentUser){status('Entre na sua conta antes de criar ou acessar um grupo.');return}
  if(action==='fbgroup'){
   const payloadSize=JSON.stringify({songs:D.songs,sets:D.sets}).length;if(payloadSize>850000){status('Repertório muito grande para um único documento do Firestore. Reduza o conteúdo antes de criar o grupo.');return}const code=Math.random().toString(36).slice(2,10).toUpperCase();const ref=doc(db,'sos_cifras_groups',code);
   await setDoc(ref,{code,owner:auth.currentUser.uid,leader:auth.currentUser.uid,members:[auth.currentUser.uid],currentSong:null,songs:D.songs,sets:D.sets,updatedAt:Date.now()});
   S.band={code,role:'leader'};document.getElementById('fbcode').value=code;status('Grupo criado. Código para os músicos: '+code);fbListen(ref);return;
  }
  if(action==='fbjoin'){
   const code=document.getElementById('fbcode').value.trim().toUpperCase();const ref=doc(db,'sos_cifras_groups',code);const snap=await getDoc(ref);if(!snap.exists()){status('Código não encontrado.');return}await updateDoc(ref,{members:arrayUnion(auth.currentUser.uid)});S.band={code,role:'member'};status('Entrou no grupo '+code+'. Aguardando sincronização.');fbListen(ref);return;
  }
  if(action==='fbsync'){
   if(S.band?.role!=='leader'){status('Somente o líder pode enviar o repertório.');return}const payloadSize=JSON.stringify({songs:D.songs,sets:D.sets}).length;if(payloadSize>850000){status('Repertório muito grande para sincronizar em um único documento Firestore.');return}await updateDoc(doc(db,'sos_cifras_groups',S.band.code),{songs:D.songs,sets:D.sets,updatedAt:Date.now()});status('Repertório e setlists enviados ao grupo.');return;
  }
 }catch(err){console.error(err);status('Falha Firebase: '+(err.code||err.message||'erro desconhecido'));}
}
function fbListen(ref){if(fbUnsub)fbUnsub();fbUnsub=FB.onSnapshot(ref,snap=>{if(!snap.exists())return;const d=snap.data();if(S.band?.role!=='leader'){if(Array.isArray(d.songs))D.songs=d.songs;if(Array.isArray(d.sets))D.sets=d.sets;if(d.currentSong&&song(d.currentSong)){S.song=d.currentSong;S.tab='busca'}save();render()}const status=document.getElementById('fbstatus');if(status)status.textContent='Grupo '+d.code+' conectado · '+(d.leader===FB.auth.currentUser?.uid?'Você é líder':'sincronizado com o líder');},err=>{const status=document.getElementById('fbstatus');if(status)status.textContent='Erro na sincronização: '+err.message;});}
async function fbSyncCurrent(id){try{if(FB&&S.band?.role==='leader')await FB.updateDoc(FB.doc(FB.db,'sos_cifras_groups',S.band.code),{currentSong:id,updatedAt:Date.now()})}catch(e){console.error(e)}}

render();
</script>

})();
